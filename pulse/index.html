<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var s=JSON.parse(localStorage.getItem('pulse.v1'));if(s&&s.theme==='light')document.documentElement.dataset.theme='light';}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0b08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<title>Pulse</title>
<style>
:root{
  --bg:#0d0b08;
  --surface:#18140f;
  --surface-2:#221b13;
  --border:#332a1c;
  --text:#f4eee0;
  --text-dim:#ab9d84;
  --text-faint:#78694f;
  --pink:#c9a26a;
  --purple:#c9a26a;
  --cyan:#e3c383;
  --orange:#d4af6e;
  --like:#b8394f;
  --gold-light:#f3d896;
  --gold:#d4af6e;
  --gold-deep:#a9812f;
  --emerald:#2f9e72;
  --grad-brand:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,var(--gold-deep));
  --font-display:Georgia,'Iowan Old Style','Times New Roman',Times,serif;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --shadow-1:0 10px 34px rgba(0,0,0,.45);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#f7f2e7;
  --surface:#fffdf9;
  --surface-2:#f0e6d2;
  --border:#e2d3ab;
  --text:#251d10;
  --text-dim:#6b5c41;
  --text-faint:#a4926e;
  --shadow-1:0 10px 30px rgba(60,45,10,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;
  transition:background .25s ease,color .25s ease;
}
body.noscroll{overflow:hidden;}
button,input,textarea{font-family:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;padding:0;}
button:active{transform:scale(.96);}
input,textarea{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-s);padding:12px 14px;font-size:15px;outline:none;width:100%;}
input:focus,textarea:focus{border-color:var(--purple);}
textarea{resize:none;font-family:inherit;}
h2{font-size:20px;margin:22px 0 12px;}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.hidden{display:none !important;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
.icon{width:22px;height:22px;flex:0 0 auto;}
.icon.filled{fill:currentColor;}

/* ===== layout frame ===== */
.frame{
  width:100%;
  max-width:430px;
  height:100vh;
  height:100dvh;
  margin-inline:auto;
  position:relative;
  overflow:hidden;
  background:var(--bg);
  display:flex;
  flex-direction:column;
}
@media (min-width:560px){
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(139,59,247,.20), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(255,45,120,.16), transparent 45%),
      var(--bg);
    background-attachment:fixed;
  }
  .frame{
    height:min(900px,94dvh);
    border-radius:44px;
    box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 0 8px #000;
    border:1px solid rgba(255,255,255,.06);
  }
}

/* ===== splash ===== */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .4s ease;
}
#splash.hide{opacity:0;pointer-events:none;}
.splash-logo{
  font-family:var(--font-display);font-style:italic;
  font-size:42px;font-weight:700;letter-spacing:.5px;
  background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pulseScale 1.1s ease-in-out infinite;
}
@keyframes pulseScale{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

/* ===== onboarding ===== */
.ob{padding:28px 24px;display:flex;flex-direction:column;justify-content:center;gap:0;}
.ob-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;height:100%;justify-content:center;}
.ob-hero{margin-bottom:36px;}
.ob-logo{font-family:var(--font-display);font-style:italic;font-size:54px;font-weight:700;letter-spacing:.5px;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;}
.ob-tagline{color:var(--text-dim);font-size:16px;}
.ob-progress{display:flex;gap:8px;margin-bottom:18px;}
.ob-progress .dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
.ob-progress .dot.active{background:var(--grad-brand);width:22px;border-radius:5px;transition:all .25s ease;}
.ob h2{font-size:19px;margin:18px 0 10px;}
.ob-sub{color:var(--text-faint);font-size:13px;margin:0 0 14px;}
.ob #obName{margin-top:4px;text-align:center;font-size:16px;}
.ob-step[data-step="1"]{width:100%;}
.ob-step[data-step="2"],.ob-step[data-step="3"]{width:100%;max-width:360px;margin-inline:auto;}
.ob .primary-btn{margin-top:26px;width:100%;max-width:320px;}

/* ===== buttons / chips ===== */
.primary-btn{
  background:var(--grad-brand);color:#fff;font-weight:700;font-size:15px;
  padding:15px 20px;border-radius:14px;transition:transform .15s ease,opacity .2s ease;
  box-shadow:0 8px 24px rgba(139,59,247,.35);
}
.primary-btn:disabled{opacity:.35;box-shadow:none;}
.secondary-btn{
  background:var(--surface-2);color:var(--text);font-weight:600;font-size:14px;
  padding:11px 16px;border-radius:12px;border:1px solid var(--border);
}
.danger-btn{background:var(--like);color:#fff;font-weight:700;padding:11px 18px;border-radius:12px;}
.settings-item.danger{color:var(--like);}

.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 4px;}
.emoji-opt{font-size:24px;background:var(--surface-2);border:2px solid transparent;border-radius:14px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:.15s ease;}
.emoji-opt.active{border-color:var(--purple);background:var(--surface);transform:scale(1.05);}

.chip-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 8px;}
.chip{background:var(--surface-2);color:var(--text-dim);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--border);transition:.15s ease;white-space:nowrap;}
.chip.active{background:var(--grad-brand);color:#fff;border-color:transparent;}
.chip.lg{font-size:14px;padding:10px 16px;}
.chip.static{background:var(--surface-2);color:var(--text-faint);cursor:default;}
.chip.static:active{transform:none;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;}
.chip-row.scrollx{scroll-snap-type:x proximity;}

/* ===== app shell ===== */
#appRoot{display:contents;}
.phone{background:var(--bg);}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 14px) 18px 12px;
  flex:0 0 auto;
}
.brand{font-family:var(--font-display);font-style:italic;font-size:23px;font-weight:700;letter-spacing:.4px;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;}
.streak-badge{display:flex;align-items:center;gap:5px;background:var(--surface-2);padding:7px 12px;border-radius:999px;border:1px solid var(--border);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;}
.streak-badge .icon{width:17px;height:17px;color:var(--orange);fill:var(--orange);}
.views{flex:1;min-height:0;}
.view{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#view-home{overflow:hidden;position:relative;}

/* ===== bottom nav ===== */
.bottomnav{
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 10px calc(var(--safe-b) + 8px);
  border-top:1px solid var(--border);
  background:var(--bg);
  flex:0 0 auto;
}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:600;flex:1;padding:6px 0;}
.navbtn .icon{color:var(--text-faint);}
.navbtn.active{color:var(--text);}
.navbtn.active .icon{color:var(--text);}
.nav-avatar{font-size:20px;line-height:1;filter:grayscale(1);opacity:.6;}
.navbtn.active .nav-avatar{filter:none;opacity:1;}
.createbtn{flex:0 0 auto;}
.create-circle{
  width:46px;height:46px;border-radius:16px;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(139,59,247,.4);
  margin-bottom:2px;
}
.create-circle .icon{color:#fff;width:24px;height:24px;}

/* ===== stories ===== */
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 16px;}
.story-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:64px;}
.story-ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;}
.story-ring.seen{background:var(--border);}
.story-ring .avatar{width:100%;height:100%;border:3px solid var(--bg);}
.story-ring.me{position:relative;}
.story-plus{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;}
.story-plus .icon{width:12px;height:12px;color:var(--bg);}
.story-label{font-size:11px;color:var(--text-dim);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;width:42px;height:42px;}
.avatar.sm{width:30px;height:30px;font-size:15px;}
.avatar.lg{width:84px;height:84px;font-size:38px;margin-bottom:12px;border:3px solid var(--surface);}

/* ===== segmented control ===== */
.segctrl{display:flex;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px;margin:0 16px 14px;width:fit-content;}
.segctrl.floating{position:absolute;top:calc(var(--safe-t) + 10px);left:50%;transform:translateX(-50%);z-index:5;margin:0;background:rgba(20,20,26,.55);backdrop-filter:blur(10px);}
.fullscreen-btn{position:absolute;top:calc(var(--safe-t) + 10px);right:14px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(20,20,26,.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:#fff;}
.fullscreen-btn .icon{width:17px;height:17px;}
:fullscreen .frame,.is-fullscreen .frame{border-radius:0;box-shadow:none;border:none;max-width:100%;width:100vw;height:100vh;height:100dvh;}
.seg{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text-faint);transition:.15s ease;}
.seg.active{background:var(--grad-brand);color:#fff;}
.refresh-btn{margin-left:auto;margin-right:16px;color:var(--text-faint);display:flex;align-items:center;padding:8px;}
.homerow{display:flex;align-items:center;}

/* ===== feed / cards ===== */
.feedscroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;}
.feedlist{display:flex;flex-direction:column;gap:22px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);margin:0 12px;overflow:hidden;}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.card-head-text{flex:1;min-width:0;}
.card-name{font-weight:700;font-size:14px;}
.card-meta{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:5px;margin-top:1px;}
.card-meta .tag{background:var(--surface-2);color:var(--text-dim);padding:2px 8px;border-radius:999px;font-weight:600;font-size:10.5px;}
.sep{opacity:.6;}

.media{position:relative;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;user-select:none;}
.card .media{margin:0;}
.media-emoji{font-size:92px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.3));pointer-events:none;}
.burst-heart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;}
.burst-heart .icon{width:96px;height:96px;color:#fff;fill:#fff;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4));}
.burst-heart.play{animation:burstpop .7s ease forwards;}
@keyframes burstpop{0%{opacity:0;transform:scale(.4);}30%{opacity:1;transform:scale(1.15);}55%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1);}}

.actions{display:flex;align-items:center;gap:16px;padding:12px 14px 4px;}
.actions.vertical{flex-direction:column;position:absolute;right:12px;bottom:110px;gap:20px;padding:0;z-index:3;}
.iconbtn{display:flex;align-items:center;gap:6px;color:var(--text);transition:transform .15s ease;}
.actions:not(.vertical) .save-btn{margin-left:auto;}
.actions.vertical .iconbtn{flex-direction:column;color:#fff;font-size:11px;font-weight:700;gap:3px;font-variant-numeric:tabular-nums;}
.actions.vertical .icon{width:28px;height:28px;}
.like-btn.active .icon{stroke:var(--like);}
.like-btn.active .icon.filled{fill:var(--like);}
.save-btn.active .icon{stroke:var(--orange);}
.save-btn.active .icon.filled{fill:var(--orange);}

.card-body{padding:2px 14px 16px;}
.likes-line{font-weight:700;font-size:13.5px;margin-bottom:4px;font-variant-numeric:tabular-nums;}
.caption{font-size:14px;line-height:1.4;}
.cap-name{font-weight:700;margin-right:5px;}
.viewcomments{display:block;margin-top:6px;color:var(--text-faint);font-size:13px;}

/* ===== reels ===== */
.reels{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000;}
.reel .media{position:absolute;inset:0;border-radius:0;aspect-ratio:auto;}
.reel-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;padding:0 16px calc(var(--safe-b) + 18px);background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 40%);}
.reel-info{flex:1;color:#fff;padding-right:70px;}
.reel-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.reel-name .tag{background:rgba(255,255,255,.18);padding:2px 9px;border-radius:999px;font-size:10.5px;}
.reel-caption{font-size:14px;line-height:1.4;opacity:.95;}
.reel-info .sound-line{color:rgba(255,255,255,.85);}

/* ===== discover ===== */
.discover-head{padding:12px 0 6px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;margin:0 16px 12px;padding:10px 14px;}
.search-box .icon{color:var(--text-faint);width:18px;height:18px;}
.search-box input{background:none;border:none;padding:0;font-size:14px;}
.explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px 24px;}
.tile{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.tile-emoji{font-size:34px;}
.tile-meta{position:absolute;bottom:6px;left:7px;display:flex;align-items:center;gap:4px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5);}
.tile-meta .icon{width:12px;height:12px;color:#fff;fill:#fff;}
.tile-play{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);z-index:1;}
.tile-play .icon{width:9px;height:9px;color:#fff;margin-left:1px;}
.tile-ai{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;backdrop-filter:blur(3px);z-index:1;letter-spacing:.3px;}
.empty-hint{color:var(--text-faint);font-size:13.5px;text-align:center;padding:40px 30px;}
.empty-hint.span3{grid-column:1/-1;}

/* ===== profile ===== */
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 24px 10px;}
.profile-name{font-size:19px;font-weight:800;}
.profile-bio{color:var(--text-dim);font-size:13.5px;margin-top:3px;max-width:280px;}
.profile-stats{display:flex;gap:28px;margin:16px 0;}
.stat{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--text-faint);font-weight:600;}
.stat b{font-size:17px;color:var(--text);font-weight:800;font-variant-numeric:tabular-nums;}
.profile-btns{display:flex;gap:10px;margin-bottom:14px;}
.settings-row{padding:10px 16px 30px;display:flex;flex-direction:column;gap:2px;}
.settings-item{display:flex;align-items:center;gap:12px;padding:14px 6px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--border);}
.settings-item .icon{color:var(--text-dim);}
.settings-item.danger .icon{color:var(--like);}
.install-step{padding:12px 2px;border-bottom:1px solid var(--border);}
.install-step:last-child{border-bottom:none;}
.install-step b{display:block;font-size:13.5px;margin-bottom:4px;}
.install-step p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.45;}

/* ===== modal / sheets ===== */
.modal-root{position:fixed;inset:0;z-index:600;pointer-events:none;}
.modal-root.open{pointer-events:auto;}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .25s ease;}
.modal-root.open .backdrop{background:rgba(0,0,0,.55);}
.sheet{
  position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);
  width:100%;max-width:430px;max-height:82%;
  background:var(--surface);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.9,.3,1);
  padding-bottom:var(--safe-b);
}
.modal-root.open .sheet{transform:translate(-50%,0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:10px auto 2px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;}
.sheet-head h3{margin:0;font-size:16px;}
.sheet-body{padding:6px 18px 22px;overflow-y:auto;}
.sheet-body .field-label{display:block;font-size:12.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px;}
.sheet-body textarea,.sheet-body input{margin-bottom:2px;}
.sheet .primary-btn{width:100%;margin-top:22px;}
.detail-sheet .sheet-body{padding:6px 0 10px;}
.detail-sheet .card{border:none;margin:0;}

.comments-list{max-height:44vh;overflow-y:auto;padding:4px 18px;display:flex;flex-direction:column;gap:14px;}
.comment-item{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;}
.comment-item div{padding-top:3px;}
.comment-input-row{display:flex;align-items:center;gap:10px;padding:12px 18px calc(var(--safe-b) + 12px);border-top:1px solid var(--border);}
.comment-input-row input{flex:1;}
.comment-input-row button{color:var(--purple);padding:6px;}

.confirm-box{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:88%;max-width:340px;background:var(--surface);border-radius:20px;padding:22px;
  text-align:center;box-shadow:var(--shadow-1);
}
.confirm-title{font-weight:800;font-size:16px;margin-bottom:8px;}
.confirm-msg{color:var(--text-dim);font-size:13.5px;line-height:1.4;margin-bottom:18px;}
.confirm-btns{display:flex;gap:10px;}
.confirm-btns button{flex:1;}

/* ===== story viewer ===== */
.story-view{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;}
.story-bars{display:flex;gap:4px;padding:calc(var(--safe-t) + 10px) 12px 0;}
.story-bars .bar{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;position:relative;}
.story-bars .bar::after{content:"";position:absolute;inset:0;background:#fff;width:0;}
.story-bars .bar.done::after{width:100%;}
.story-bars .bar.run::after{animation:storybar 4s linear forwards;}
@keyframes storybar{from{width:0;}to{width:100%;}}
.story-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:#fff;}
.story-user{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;}
.story-top button{color:#fff;padding:6px;}
.story-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px;}
.story-emoji{font-size:76px;}
.story-text{color:#fff;font-size:19px;font-weight:700;max-width:280px;text-shadow:0 2px 10px rgba(0,0,0,.3);}
.story-zones{position:absolute;inset:0;display:flex;top:60px;}
.story-zones .zone{flex:1;height:100%;}

/* ===== toast ===== */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);
  background:#1c1710;color:#fff;padding:12px 20px;border-radius:999px;border:1px solid rgba(212,175,110,.25);
  font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:all .3s ease;z-index:9500;
  max-width:86%;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ===== topbar right / messages entry ===== */
.topbar-right{display:flex;align-items:center;gap:8px;}
.msg-icon-btn{position:relative;background:var(--surface-2);border:1px solid var(--border);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);}
.msg-icon-btn .icon{width:19px;height:19px;}
.msg-badge{position:absolute;top:-2px;right:-2px;background:var(--like);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg);}

/* ===== video / ai content flavor ===== */
.play-badge{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.play-badge .icon{width:12px;height:12px;color:#fff;margin-left:1px;}
.ai-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px);}
.sound-line{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);margin-top:6px;}
.sound-line .icon{width:12px;height:12px;}
.media.video .media-emoji{animation:mediaDrift 6s ease-in-out infinite;}
.video-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22);z-index:2;overflow:hidden;}
.video-progress::after{content:"";position:absolute;inset:0;background:var(--gold-light);width:0;animation:videoProgress 8s linear infinite;}
@keyframes videoProgress{0%{width:0;}100%{width:100%;}}
.tts-scene,.tll-scene,.bcd-scene{width:80%;height:80%;overflow:visible;}
.tts-shadow{fill:rgba(0,0,0,.35);}
.tts-log{transform-origin:100px 130px;animation:ttsBob 1.2s ease-in-out infinite;}
.tts-body{fill:url(#ttsWoodGrad);}
.tts-top{fill:#8a5a2b;}
.tts-eye{fill:#1a120a;}
.tts-mouth{fill:none;stroke:#1a120a;stroke-width:3;stroke-linecap:round;}
.tts-arm{transform-origin:128px 100px;animation:ttsSwing 1.2s ease-in-out infinite;}
.tts-stick{fill:#5c3a1e;}
.tts-drum{transform-origin:150px 160px;animation:ttsHit 1.2s ease-in-out infinite;}
.tts-drumtop,.tts-drumbottom{fill:var(--gold);}
.tts-drumbody{fill:var(--gold-deep);}
.tts-impact{opacity:0;transform-origin:150px 125px;animation:ttsImpact 1.2s ease-in-out infinite;}
.tts-impact line{stroke:var(--gold-light);stroke-width:3;stroke-linecap:round;}
@keyframes ttsBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-2deg);}}
@keyframes ttsSwing{0%,20%{transform:rotate(-35deg);}35%,100%{transform:rotate(10deg);}}
@keyframes ttsHit{0%,30%{transform:scale(1);}38%{transform:scale(1.08,.92);}50%,100%{transform:scale(1);}}
@keyframes ttsImpact{0%,32%{opacity:0;transform:scale(.6);}38%{opacity:1;transform:scale(1);}50%,100%{opacity:0;transform:scale(1.3);}}
@keyframes mediaDrift{0%,100%{transform:scale(1) translateY(0);}50%{transform:scale(1.06) translateY(-5px);}}

.tll-shadow{fill:rgba(0,0,0,.35);}
.tll-speedlines{animation:tllSpeed .5s ease-in-out infinite;}
.tll-speedlines line{stroke:rgba(255,255,255,.55);stroke-width:3;stroke-linecap:round;}
.tll-body-group{transform-origin:98px 120px;animation:tllBob .5s ease-in-out infinite;}
.tll-body{fill:#7d92a8;}
.tll-fin{fill:#5c6f82;}
.tll-eye{fill:#111;}
.tll-mouth{fill:none;stroke:#111;stroke-width:2.5;stroke-linecap:round;}
.tll-leg-back{transform-origin:79px 110px;animation:tllLegBack .5s ease-in-out infinite;}
.tll-leg-front{transform-origin:113px 110px;animation:tllLegFront .5s ease-in-out infinite;}
.tll-legshape{fill:#4a5c6e;}
.tll-shoe{fill:#2f6fd6;}
@keyframes tllBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes tllLegBack{0%,100%{transform:rotate(25deg);}50%{transform:rotate(-25deg);}}
@keyframes tllLegFront{0%,100%{transform:rotate(-25deg);}50%{transform:rotate(25deg);}}
@keyframes tllSpeed{0%,100%{opacity:.6;}50%{opacity:.1;}}

.bcd-shadow{fill:rgba(0,0,0,.3);}
.bcd-trail{opacity:.55;animation:bcdTrail 1.1s ease-in-out infinite;}
.bcd-trail circle{fill:rgba(255,255,255,.6);}
.bcd-flight{animation:bcdFly 1.1s ease-in-out infinite;}
.bcd-body{fill:#3f7a52;}
.bcd-snout{fill:#356a46;}
.bcd-eye{fill:#111;}
.bcd-wing-back{transform-origin:97px 92px;animation:bcdWingBack .35s ease-in-out infinite;}
.bcd-wing-front{transform-origin:97px 104px;animation:bcdWingFront .35s ease-in-out infinite;}
.bcd-wingshape,.bcd-wingshape2{fill:#2f5c3d;}
@keyframes bcdFly{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}
@keyframes bcdWingBack{0%,100%{transform:rotate(-20deg);}50%{transform:rotate(20deg);}}
@keyframes bcdWingFront{0%,100%{transform:rotate(20deg);}50%{transform:rotate(-20deg);}}
@keyframes bcdTrail{0%,100%{opacity:.6;transform:translateX(0);}100%{opacity:0;transform:translateX(-15px);}}

/* ===== messages ===== */

.add-friend-row{border:1px dashed var(--border);margin-top:4px;}

.thread-top-info{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}

.typing-dot:nth-child(3){animation-delay:.3s;}

.audio-bubble{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:18px;min-width:190px;cursor:pointer;border:none;}

.image-bubble{padding:0;border-radius:16px;overflow:hidden;border:none;display:block;max-width:220px;}

.msg-options-sheet{position:relative;width:100%;max-width:430px;background:var(--surface);border-radius:22px 22px 0 0;padding-bottom:var(--safe-b);display:flex;flex-direction:column;}

  *{transition-duration:.001ms !important;}

}

/* ===== helpers ===== */
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtNum(n){
  if(n>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'')+'m';
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(n);
}
function timeAgo(ts){
  var diff = Math.max(0, Date.now()-ts);
  var m = Math.floor(diff/60000);
  if(m<1) return 'now';
  if(m<60) return m+'m';
  var h = Math.floor(m/60);
  if(h<24) return h+'h';
  var d = Math.floor(h/24);
  return d+'d';
}
function formatClockTime(ts){
  var d = new Date(ts);
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h>=12?'PM':'AM';
  var h12 = h%12; if(h12===0) h12=12;
  return h12+':'+(m<10?'0':'')+m+' '+ampm;
}
function formatAudioDuration(sec){
  sec = Math.max(0, Math.round(sec||0));
  var m = Math.floor(sec/60), s = sec%60;
  return m+':'+(s<10?'0':'')+s;
}

var KEY_STORAGE_KEY = 'pulse.key';
var cryptoKeyPromise = null;
function bufToB64(buf){
  var bytes = new Uint8Array(buf), s = '';
  for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function b64ToBuf(b64){
  var s = atob(b64), bytes = new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) bytes[i] = s.charCodeAt(i);
  return bytes;
}
function cryptoAvailable(){
  return !!(window.crypto && window.crypto.subtle);
}
function getOrCreateKey(){
  if(cryptoKeyPromise) return cryptoKeyPromise;
  cryptoKeyPromise = (async function(){
    if(!cryptoAvailable()) return null;
    try{
      var stored = localStorage.getItem(KEY_STORAGE_KEY);
      if(stored){
        return await crypto.subtle.importKey('raw', b64ToBuf(stored), {name:'AES-GCM'}, true, ['encrypt','decrypt']);
      }
      var key = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
      var exported = await crypto.subtle.exportKey('raw', key);
      localStorage.setItem(KEY_STORAGE_KEY, bufToB64(exported));
      return key;
    }catch(e){ return null; }
  })();
  return cryptoKeyPromise;
}
async function encryptString(plain){
  var key = await getOrCreateKey();
  if(!key) return null;
  try{
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(plain));
    var cipherBytes = new Uint8Array(cipherBuf);
    var combined = new Uint8Array(iv.length + cipherBytes.length);
    combined.set(iv, 0); combined.set(cipherBytes, iv.length);
    return bufToB64(combined);
  }catch(e){ return null; }
}
async function decryptString(b64){
  var key = await getOrCreateKey();
  if(!key) return null;
  try{
    var combined = b64ToBuf(b64);
    var iv = combined.slice(0,12), data = combined.slice(12);
    var plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, data);
    return new TextDecoder().decode(plainBuf);
  }catch(e){ return null; }
}
async function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var jsonStr = raw;
      if(localStorage.getItem(STORAGE_KEY+'.enc')==='1'){
        var decrypted = await decryptString(raw);
        if(!decrypted) return defaultState();
        jsonStr = decrypted;
      }
      var parsed = JSON.parse(jsonStr);
      var merged = defaultState();
      for(var k in parsed){ merged[k] = parsed[k]; }
      if(!merged.posts || !merged.posts.length) merged.posts = seedPosts();
      return merged;
    }
  }catch(e){}
  return defaultState();
}
var state = defaultState();
function save(){
  try{
    var json = JSON.stringify(state);
    encryptString(json).then(function(cipher){
      try{
        if(cipher){ localStorage.setItem(STORAGE_KEY, cipher); localStorage.setItem(STORAGE_KEY+'.enc','1'); }
        else { localStorage.setItem(STORAGE_KEY, json); localStorage.removeItem(STORAGE_KEY+'.enc'); }
      }catch(e){}
    }).catch(function(){
      try{ localStorage.setItem(STORAGE_KEY, json); localStorage.removeItem(STORAGE_KEY+'.enc'); }catch(e){}
    });
  }catch(e){}
}
function findPost(id){
  for(var i=0;i<state.posts.length;i++){ if(state.posts[i].id===id) return state.posts[i]; }
  return null;
}

var feedShuffled = false;
var shuffledIds = [];
function sortedPosts(){
  if(feedShuffled){
    var map = {};
    state.posts.forEach(function(p){ map[p.id]=p; });
    return shuffledIds.map(function(id){ return map[id]; }).filter(Boolean);
  }
  return state.posts.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
}
function shuffleFeed(){
  var ids = sortedPosts().map(function(p){ return p.id; });
  for(var i=ids.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = ids[i]; ids[i]=ids[j]; ids[j]=tmp;
  }
  shuffledIds = ids;
  feedShuffled = true;
  renderHome();
  showToast('Feed refreshed ✨');
}

function updateStreak(){
  var today = todayStr();
  if(state.streak.last === today) return null;
  var y = new Date(); y.setDate(y.getDate()-1);
  var yest = todayStr(y);
  if(state.streak.last === yest){ state.streak.count += 1; }
  else { state.streak.count = 1; }
  state.streak.last = today;
  save();
  return state.streak.count;
}

function mediaHtml(p){
  var badges = '';
  if(p.video) badges += '<span class="play-badge">'+icon('play','filled')+'</span>';
  if(p.ai) badges += '<span class="ai-badge">✨ AI</span>';
  var content = SCENES[p.scene] || '<span class="media-emoji">'+p.emoji+'</span>';
  return '<div class="media '+(p.video?'video':'')+'" data-action="media-tap" data-id="'+p.id+'" style="background:'+p.gradient+'">' +
    content +
    badges +
    (p.video ? '<span class="video-progress"></span>' : '') +
    '<span class="burst-heart">'+icon('heart','filled')+'</span>' +
  '</div>';
}
function soundLineHtml(p){
  return p.video ? '<div class="sound-line">'+icon('music')+'<span>original sound · '+escapeHtml(p.name)+'</span></div>' : '';
}
function actionsHtml(p, vertical){
  var liked=p.likedByMe, saved=p.savedByMe;
  var count = fmtNum(p.likeCount+(liked?1:0));
  return '<div class="actions '+(vertical?'vertical':'')+'">' +
    '<button class="iconbtn like-btn '+(liked?'active':'')+'" data-action="like" data-id="'+p.id+'" aria-label="Like">'+icon('heart', liked?'filled':'')+(vertical?'<span>'+count+'</span>':'')+'</button>' +
    '<button class="iconbtn" data-action="comments" data-id="'+p.id+'" aria-label="Comments">'+icon('comment')+(vertical?'<span>'+p.comments.length+'</span>':'')+'</button>' +
    (vertical?'':'') +
    '<button class="iconbtn save-btn '+(saved?'active':'')+'" data-action="save" data-id="'+p.id+'" aria-label="Save">'+icon('bookmark', saved?'filled':'')+(vertical?'<span>Save</span>':'')+'</button>' +
    '<button class="iconbtn" data-action="share" data-id="'+p.id+'" aria-label="Share">'+icon('share')+(vertical?'<span>Share</span>':'')+'</button>' +
  '</div>';
}
function likesLineHtml(p){
  return '<div class="likes-line">'+fmtNum(p.likeCount+(p.likedByMe?1:0))+' likes</div>';
}
function captionHtml(p){
  return '<div class="caption"><span class="cap-name">'+escapeHtml(p.name)+'</span> '+escapeHtml(p.caption)+'</div>';
}
function postCardHtml(p){
  return '<article class="card" data-id="'+p.id+'">' +
    '<header class="card-head">' +
      '<div class="avatar" style="background:'+p.gradient+'">'+p.avatar+'</div>' +
      '<div class="card-head-text">' +
        '<div class="card-name">'+escapeHtml(p.name)+'</div>' +
        '<div class="card-meta"><span class="tag">'+p.category+'</span><span class="sep">•</span><span>'+timeAgo(p.createdAt)+'</span></div>' +
      '</div>' +
    '</header>' +
    mediaHtml(p) +
    actionsHtml(p,false) +
    '<div class="card-body">' +
      likesLineHtml(p) +
      captionHtml(p) +
      soundLineHtml(p) +
      (p.comments.length ? '<button class="viewcomments" data-action="comments" data-id="'+p.id+'">View all '+p.comments.length+' comments</button>' : '') +
    '</div>' +
  '</article>';
}
function reelCardHtml(p){
  return '<div class="reel" data-id="'+p.id+'">' +
    mediaHtml(p) +
    '<div class="reel-overlay">' +
      '<div class="reel-info">' +
        '<div class="reel-name"><span class="avatar sm" style="background:'+p.gradient+'">'+p.avatar+'</span>'+escapeHtml(p.name)+'<span class="tag">'+p.category+'</span></div>' +

        soundLineHtml(p) +
      '</div>' +
      actionsHtml(p,true) +

function tileHtml(p){
  var badges = '';
  if(p.video) badges += '<span class="tile-play">'+icon('play','filled')+'</span>';
  if(p.ai) badges += '<span class="tile-ai">AI</span>';
  return '<button type="button" class="tile" data-action="open-detail" data-id="'+p.id+'" style="background:'+p.gradient+'">' +
    badges +
    '<span class="tile-emoji">'+p.emoji+'</span>' +
    '<span class="tile-meta">'+icon('heart','filled')+' '+fmtNum(p.likeCount+(p.likedByMe?1:0))+'</span>' +
  '</button>';
}

/* ===== like / save / double-tap ===== */
function patchLikeUI(id){
  var p = findPost(id); if(!p) return;
  document.querySelectorAll('.like-btn[data-id="'+id+'"]').forEach(function(btn){
    btn.classList.toggle('active', p.likedByMe);
    var span = btn.querySelector('span');
    btn.innerHTML = icon('heart', p.likedByMe?'filled':'') + (span? '<span>'+fmtNum(p.likeCount+(p.likedByMe?1:0))+'</span>':'');
  });
  document.querySelectorAll('.card[data-id="'+id+'"] .likes-line').forEach(function(elm){
    elm.textContent = fmtNum(p.likeCount + (p.likedByMe?1:0)) + ' likes';
  });
}
function patchSaveUI(id){
  var p = findPost(id); if(!p) return;
  document.querySelectorAll('.save-btn[data-id="'+id+'"]').forEach(function(btn){
    btn.classList.toggle('active', p.savedByMe);
    var span = btn.querySelector('span');
    btn.innerHTML = icon('bookmark', p.savedByMe?'filled':'') + (span? '<span>Save</span>':'');
  });
}
function toggleLike(id){
  var p = findPost(id); if(!p) return;
  p.likedByMe = !p.likedByMe;
  save();
  patchLikeUI(id);
}
function toggleSave(id){
  var p = findPost(id); if(!p) return;
  p.savedByMe = !p.savedByMe;
  save();
  patchSaveUI(id);
  if(p.savedByMe) showToast('Saved ✨');
}
var lastTap = {id:null, time:0};
function handleMediaTap(id, el){
  var now = Date.now();
  var isDouble = lastTap.id===id && (now-lastTap.time)<380;
  if(isDouble){
    lastTap = {id:null,time:0};
    var p = findPost(id);
    if(p){
      if(!p.likedByMe){ p.likedByMe=true; save(); patchLikeUI(id); }
      triggerBurst(el);
    }
  } else {
    lastTap = {id:id, time:now};
  }
}
function triggerBurst(mediaEl){
  var burst = mediaEl.querySelector('.burst-heart');
  if(!burst) return;
  burst.classList.remove('play');
  void burst.offsetWidth;
  burst.classList.add('play');
}

/* ===== stories viewer ===== */
var storyTimer = null;
var currentStoryIndex = 0;
function showStory(index){
  clearTimeout(storyTimer);
  if(index<0 || index>=CATEGORIES.length){ closeModal(); return; }
  currentStoryIndex = index;
  var cat = CATEGORIES[index];
  state.storiesSeen[cat] = true; save();
  var bars = CATEGORIES.map(function(c,i){
    return '<span class="bar '+(i<index?'done':'')+' '+(i===index?'run':'')+'"></span>';
  }).join('');
  var html = '<div class="story-view">' +
    '<div class="story-bars">'+bars+'</div>' +
    '<div class="story-top">' +
      '<div class="story-user"><span class="avatar sm" style="background:'+GRADIENTS[index%GRADIENTS.length]+'">'+categoryEmoji(cat)+'</span>'+cat+' Recap</div>' +
      '<button data-action="close-modal" aria-label="Close">'+icon('close')+'</button>' +
    '</div>' +
    '<div class="story-content" style="background:'+GRADIENTS[index%GRADIENTS.length]+'">' +
      '<div class="story-emoji">'+categoryEmoji(cat)+'</div>' +
      '<div class="story-text">'+(STORY_LINES[cat]||'Catch up on what you missed ✨')+'</div>' +
    '</div>' +
    '<div class="story-zones"><button class="zone left" data-action="story-prev" aria-label="Previous"></button><button class="zone right" data-action="story-next" aria-label="Next"></button></div>' +
  '</div>';
  openModal(html);
  storyTimer = setTimeout(function(){ showStory(index+1); }, 4000);
}

/* ===== discover ===== */
var discoverQuery = '';
var discoverCat = 'All';
function renderDiscover(){
  var el = document.getElementById('view-discover');
  var chips = ['All'].concat(CATEGORIES).map(function(c){
    return '<button type="button" class="chip '+(discoverCat===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>';
  }).join('');
  el.innerHTML =
    '<div class="discover-head">' +
      '<div class="search-box">'+icon('search')+'<input type="text" id="searchInput" placeholder="Search posts, people, categories"></div>' +
      '<div class="chip-row scrollx" id="discoverChips">'+chips+'</div>' +
    '</div>' +
    '<div class="explore-grid" id="discoverGrid"></div>';
  document.getElementById('searchInput').value = discoverQuery;
  updateDiscoverGrid();
  document.getElementById('searchInput').addEventListener('input', function(e){
    discoverQuery = e.target.value;
    updateDiscoverGrid();
  });
  document.getElementById('discoverChips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    discoverCat = b.dataset.cat;
    document.querySelectorAll('#discoverChips .chip').forEach(function(x){ x.classList.toggle('active', x===b); });
    updateDiscoverGrid();
  });
}
function updateDiscoverGrid(){
  var grid = document.getElementById('discoverGrid');
  if(!grid) return;
  var q = discoverQuery.trim().toLowerCase();
  var results = sortedPosts().filter(function(p){
    var matchCat = discoverCat==='All' || p.category===discoverCat;
    var matchQ = !q || p.caption.toLowerCase().indexOf(q)>-1 || p.name.toLowerCase().indexOf(q)>-1 || p.category.toLowerCase().indexOf(q)>-1;
    return matchCat && matchQ;
  });
  grid.innerHTML = results.length ? results.map(tileHtml).join('') : '<div class="empty-hint span3">No posts found. Try a different search 🔍</div>';
}
function openDetail(id){
  var p = findPost(id); if(!p) return;

/* ===== modal system ===== */
function openModal(html){
  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="backdrop" data-action="close-modal"></div>' + html;
  root.classList.add('open');
  document.body.classList.add('noscroll');
}
function closeModal(){
  clearTimeout(storyTimer); storyTimer=null;
  if(callState){
    clearTimeout(callState.ringTimeout);
    clearInterval(callState.timerInt);
    stopRingTone();
    callState = null;
  }
  if(mediaRecorder && mediaRecorder.state==='recording'){ cancelVoiceRecording(); }
  var root = document.getElementById('modalRoot');
  root.classList.remove('open');
  document.body.classList.remove('noscroll');
  setTimeout(function(){ if(!root.classList.contains('open')) root.innerHTML=''; }, 300);
}
function openConfirm(title, msg, confirmLabel, onConfirm){
  var html = '<div class="confirm-box">' +
    '<div class="confirm-title">'+escapeHtml(title)+'</div>' +
    '<div class="confirm-msg">'+escapeHtml(msg)+'</div>' +
    '<div class="confirm-btns"><button class="secondary-btn" data-action="close-modal">Cancel</button><button class="danger-btn" id="confirmYes">'+escapeHtml(confirmLabel)+'</button></div>' +
  '</div>';
  openModal(html);
  document.getElementById('confirmYes').addEventListener('click', onConfirm);
}

/* ===== create post ===== */
function openCreateModal(){
  var emojiOptions = ['🥊','🤼','🎮','🎧','😂','🎬','🏀','💻','🔥','🎵','⚡','🍕','🐉','🎤','🏆','📸','🐊','🥁'];
  var html = '<div class="sheet create-sheet">' +
    '<div class="sheet-handle"></div>' +
    '<div class="sheet-head"><h3>New Post</h3><button data-action="close-modal" aria-label="Close">'+icon('close')+'</button></div>' +
    '<div class="sheet-body">' +
      '<label class="field-label">Pick a vibe</label>' +
      '<div class="emoji-grid" id="createEmojiGrid">' + emojiOptions.map(function(em){ return '<button type="button" class="emoji-opt" data-emoji="'+em+'">'+em+'</button>'; }).join('') + '</div>' +
      '<label class="field-label" for="createCaption">Caption</label>' +
      '<textarea id="createCaption" maxlength="200" placeholder="What\'s on your mind?" rows="3"></textarea>' +
      '<label class="field-label">Category</label>' +
      '<div class="chip-grid" id="createCatRow">' + CATEGORIES.map(function(c){ return '<button type="button" class="chip" data-cat="'+c+'">'+categoryEmoji(c)+' '+c+'</button>'; }).join('') + '</div>' +
      '<button class="primary-btn" id="createSubmitBtn" disabled>Share Post</button>' +
    '</div>' +
  '</div>';
  openModal(html);

  var draft = {emoji:null, cat:null};
  var grid = document.getElementById('createEmojiGrid');
  var catRow = document.getElementById('createCatRow');
  var capField = document.getElementById('createCaption');
  var submitBtn = document.getElementById('createSubmitBtn');
  function refresh(){ submitBtn.disabled = !(draft.emoji && draft.cat && capField.value.trim().length>0); }
  grid.addEventListener('click', function(e){
    var b = e.target.closest('.emoji-opt'); if(!b) return;
    grid.querySelectorAll('.emoji-opt').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    draft.emoji = b.dataset.emoji;
    refresh();
  });
  catRow.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    catRow.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    draft.cat = b.dataset.cat;
    refresh();
  });
  capField.addEventListener('input', refresh);
  submitBtn.addEventListener('click', function(){
    if(submitBtn.disabled) return;
    createPost(draft.emoji, draft.cat, capField.value.trim());
  });
}
function createPost(emoji, cat, caption){
  var p = {
    id: uid(),
    mine:true,
    name: state.user.name || 'you',
    avatar: state.user.avatar,
    category: cat,
    emoji: emoji,
    gradient: GRADIENTS[Math.floor(Math.random()*GRADIENTS.length)],
    caption: caption,
    likeCount: 0,
    likedByMe:false,
    savedByMe:false,
    comments:[],
    createdAt: Date.now()
  };
  state.posts.unshift(p);
  feedShuffled = false;

function canvasRoundRect(ctx,x,y,w,h,r){
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  var words = text.split(' ');
  var line = '', lines = [];
  for(var i=0;i<words.length;i++){
    var test = line + words[i] + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line.trim());
      line = words[i] + ' ';
      if(lines.length>=maxLines-1) break;
    } else {
      line = test;
    }
  }
  if(lines.length<maxLines) lines.push(line.trim());
  lines.forEach(function(l,idx){ ctx.fillText(l, x, y+idx*lineHeight); });
}
function downloadPostImage(id){
  var p = findPost(id); if(!p) return;
  closeModal();
  try{
    var W=720,H=900;
    var canvas = document.createElement('canvas');
    canvas.width=W; canvas.height=H;
    var ctx = canvas.getContext('2d');
    var colors = (p.gradient.match(/#[0-9a-fA-F]{6}/g)) || ['#4a2a52','#0d0b08'];
    var grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[colors.length-1]);
    ctx.fillStyle = grad;
    canvasRoundRect(ctx,0,0,W,H,36);
    ctx.fill();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='260px sans-serif';
    ctx.fillText(p.emoji, W/2, H/2-60);
    ctx.textAlign='left';
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.fillRect(0,H-186,W,186);
    ctx.fillStyle='#fff';
    ctx.font='bold 32px sans-serif';
    ctx.fillText('@'+p.name, 36, H-142);
    ctx.font='24px sans-serif';
    wrapCanvasText(ctx, p.caption, 36, H-100, W-72, 32, 2);
    ctx.textAlign='right';
    ctx.font='italic bold 28px Georgia, serif';
    ctx.fillStyle='#f3d896';
    ctx.fillText('Pulse', W-32, 46);
    canvas.toBlob(function(blob){
      if(!blob){ showToast('Could not create image on this device'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'pulse-'+p.name+'.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      showToast('Downloaded ✨');
    }, 'image/png');
  }catch(e){ showToast('Could not download on this device'); }
}

function audioWaveformBars(seed){

    var h = 25 + ((s*(i+7)*13) % 65);
    bars += '<span class="wave-bar" style="height:'+h+'%"></span>';
  }
  return bars;
}

  var replyBlock = m.replyTo ? '<div class="reply-quote"><b>'+escapeHtml(m.replyTo.name)+'</b>'+escapeHtml(m.replyTo.snippet)+'</div>' : '';
  var inner;
  if(m.type==='sticker' || m.type==='gif'){
    inner = '<div class="sticker-bubble">'+replyBlock+'<span class="'+(m.animClass?('gif-anim '+m.animClass):'')+'">'+m.content+'</span></div>';
  } else if(m.type==='audio'){
    inner = replyBlock + audioBubbleHtml(m);
  } else if(m.type==='image'){
    inner = replyBlock + imageBubbleHtml(m);
  } else {
    inner = '<div class="bubble">'+replyBlock+escapeHtml(m.text)+'</div>';
  }
  var row = '<div class="msg-row '+(mine?'me':'them')+'">';
  if(!mine) row += '<span class="avatar sm" style="background:'+f.gradient+'">'+f.avatar+'</span>';
  row += '<div class="msg-col">' + inner + msgMetaHtml(m, mine) + '</div>';
  if(m.reaction) row += '<span class="msg-reaction">'+m.reaction+'</span>';

var mediaRecorder = null;
var recordedChunks = [];
var recordingTimerInt = null;
var recordingSeconds = 0;
var recordingStream = null;
var recordingFriendId = null;
function stopStreamTracks(){
  if(recordingStream){ recordingStream.getTracks().forEach(function(t){ t.stop(); }); recordingStream=null; }
}
function startVoiceRecording(friendId){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('Voice messages need microphone access, not available here');
    return;
  }
  recordingFriendId = friendId;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recordingStream = stream;
    recordedChunks = [];
    try{ mediaRecorder = new MediaRecorder(stream); }
    catch(e){ showToast('Voice recording is not supported in this browser'); stopStreamTracks(); return; }
    mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = function(){
      var mime = mediaRecorder.mimeType || 'audio/webm';
      var blob = new Blob(recordedChunks, {type:mime});
      var secs = recordingSeconds;
      stopStreamTracks();
      if(secs>=1) finishVoiceRecording(recordingFriendId, blob, secs);
    };
    mediaRecorder.start();
    recordingSeconds = 0;
    showRecordingUI();
    updateRecordingTimer(0);
    recordingTimerInt = setInterval(function(){
      recordingSeconds++;
      updateRecordingTimer(recordingSeconds);
      if(recordingSeconds>=60) stopVoiceRecording();
    }, 1000);
  }).catch(function(){
    showToast('Microphone access was blocked — check your browser permissions');
  });
}
function stopVoiceRecording(){
  clearInterval(recordingTimerInt);
  hideRecordingUI();
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
}
function cancelVoiceRecording(){
  clearInterval(recordingTimerInt);
  hideRecordingUI();
  recordedChunks = [];
  if(mediaRecorder && mediaRecorder.state!=='inactive'){
    mediaRecorder.onstop = function(){ stopStreamTracks(); };
    mediaRecorder.stop();
  } else {
    stopStreamTracks();
  }
}
function finishVoiceRecording(friendId, blob, duration){
  var reader = new FileReader();
  reader.onload = function(){
    var f = findFriend(friendId); if(!f) return;
    var m = {id:uid(), from:'me', type:'audio', content:reader.result, duration:duration, ts:Date.now()};
    finalizeSentMessage(friendId, f, m);
  };
  reader.onerror = function(){ showToast('Could not save that voice message'); };
  reader.readAsDataURL(blob);
}

/* ===== calls ===== */
var callState = null;
var audioCtx = null;
var ringInterval = null;
function playRingTick(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=520;
    o.connect(g); g.connect(audioCtx.destination);
    var t = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.4);
    o.start(t); o.stop(t+0.45);
  }catch(e){}
}
function startRingTone(){
  try{
    playRingTick();
    ringInterval = setInterval(playRingTick, 1600);
  }catch(e){}
}
function stopRingTone(){
  clearInterval(ringInterval);
  ringInterval = null;
}
function fmtDuration(sec){
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function openCall(friendId, type){
  var f = findFriend(friendId); if(!f) return;
  callState = {friendId:friendId, type:type, connected:false, startedAt:0, elapsed:0, muted:false, speaker:false, timerInt:null, ringTimeout:null};
  renderCallScreen(f, 'Calling...');
  startRingTone();
  callState.ringTimeout = setTimeout(function(){ connectCall(f); }, 2200);
}
function renderCallScreen(f, status){
  var html = '<div class="call-screen" data-state="'+(callState.connected?'connected':'ringing')+'">' +
    '<div class="call-bg" style="background:'+f.gradient+'"></div>' +
    (callState.type==='video' ? '<div class="call-self-preview">'+state.user.avatar+'</div>' : '') +
    '<div class="call-info">' +
      '<div class="call-avatar-ring"><span class="avatar xl" style="background:'+f.gradient+'">'+f.avatar+'</span></div>' +
      '<div class="call-name">'+escapeHtml(f.name)+'</div>' +
      '<div class="call-status" id="callStatus">'+status+'</div>' +
    '</div>' +
    '<div class="call-controls">' +
      '<button class="call-toggle '+(callState.muted?'active':'')+'" data-action="call-toggle-mute">🎤<span>Mute</span></button>' +
      '<button class="call-toggle '+(callState.speaker?'active':'')+'" data-action="call-toggle-speaker">🔊<span>Speaker</span></button>' +
      (callState.type==='video' ? '<button class="call-toggle" data-action="call-toggle-cam">🔄<span>Flip</span></button>' : '') +
    '</div>' +
    '<button class="end-call-btn" data-action="call-end" aria-label="End call">'+icon('phone')+'</button>' +
  '</div>';
  openModal(html);
}
function connectCall(f){
  if(!callState) return;
  callState.connected = true;
  callState.startedAt = Date.now();
  stopRingTone();
  renderCallScreen(f, '00:00');
  callState.timerInt = setInterval(function(){
    if(!callState) return;
    callState.elapsed = Math.floor((Date.now()-callState.startedAt)/1000);
    var elm = document.getElementById('callStatus');
    if(elm) elm.textContent = fmtDuration(callState.elapsed);
  }, 1000);
}
function endCall(){
  if(!callState) return;
  var f = findFriend(callState.friendId);
  clearTimeout(callState.ringTimeout);
  clearInterval(callState.timerInt);
  stopRingTone();
  var elapsed = callState.elapsed||0;
  var label = (callState.type==='video'?'🎥 Video call':'📞 Voice call') + (callState.connected ? ' · '+fmtDuration(elapsed) : ' · not answered');
  if(f){
    var th = state.threads[f.id];
    var m = {id:uid(), from:'me', type:'call', text:label, ts:Date.now()};
    th.messages.push(m);
    save();
  }
  callState = null;
  if(f) renderThreadScreen(f); else openInbox();
}

  var btn = document.querySelector('.call-toggle[data-action="call-toggle-mute"]');

document.addEventListener('click', function(e){

  switch(action){
    case 'nav': setView(t.dataset.view); break;
    case 'create-open': openCreateModal(); break;
    case 'close-modal': closeModal(); break;
    case 'like': toggleLike(id); break;
    case 'save': toggleSave(id); break;
    case 'media-tap': handleMediaTap(id, t); break;
    case 'comments': openComments(id); break;
    case 'share': openShare(id); break;
    case 'download-post': downloadPostImage(id); break;
    case 'copy-caption': copyCaption(id); break;
    case 'share-story': shareToStory(); break;
    case 'toggle-fullscreen': toggleFullscreen(); break;
    case 'send-comment': sendComment(id); break;
    case 'feedmode': state.feedMode = t.dataset.mode; save(); renderHome(); break;
    case 'refresh-feed': shuffleFeed(); break;
    case 'story-open': showStory(Number(t.dataset.index)); break;
    case 'story-prev': showStory(currentStoryIndex-1); break;
    case 'story-next': showStory(currentStoryIndex+1); break;
    case 'open-detail': openDetail(id); break;
    case 'edit-profile': openEditProfile(); break;
    case 'edit-interests': openEditInterests(); break;
    case 'profile-tab': state.profileTab = t.dataset.tab; save(); renderProfile(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'confirm-reset': confirmReset(); break;
    case 'install': openInstallModal(); break;
    case 'ob-next': if(!t.disabled) goToStep(Number(t.dataset.goto)); break;
    case 'ob-finish': if(!t.disabled) finishOnboarding(); break;
    case 'open-inbox': openInbox(); break;
    case 'open-thread': openThread(id); break;
    case 'send-msg': sendMsg(id); break;
    case 'send-sticker': sendSticker(id, t.dataset.emoji, t.dataset.anim); break;
    case 'toggle-sticker-panel': toggleStickerPanel(); break;
    case 'sticker-tab': setStickerTab(t.dataset.tab); break;
    case 'call-start': openCall(id, t.dataset.type); break;
    case 'call-end': endCall(); break;
    case 'call-toggle-mute': toggleCallMute(); break;
    case 'call-toggle-speaker': toggleCallSpeaker(); break;
    case 'call-toggle-cam': toggleCallCam(); break;
    case 'add-friend': openAddFriend(); break;
    case 'remove-friend': removeFriend(id); break;
    case 'msg-options': openMsgOptions(id, t.dataset.mine); break;
    case 'react-msg': reactToMessage(t.dataset.emoji); break;
    case 'reply-to-msg': startReply(); break;
    case 'copy-msg': copyMessageText(); break;
    case 'delete-msg': deleteMessage(); break;
    case 'cancel-reply': cancelReply(); break;
    case 'trigger-photo': triggerPhotoPicker(); break;
    case 'view-image': openImageViewerFor(id); break;
    case 'close-image-viewer': closeImageViewer(); break;
    case 'close-msg-options': closeMsgOptions(); break;
    case 'stop-recording': stopVoiceRecording(); break;
    case 'cancel-recording': cancelVoiceRecording(); break;
    case 'play-audio': toggleAudioPlayback(id, t); break;
    case 'mic-or-send':
      var micInput = document.getElementById('msgInput');
      if(micInput && micInput.value.trim()){ sendMsg(id); } else { startVoiceRecording(id); }
      break;
  }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(document.getElementById('msgOptionsOverlay')){ closeMsgOptions(); return; }
    if(document.querySelector('.image-viewer')){ closeImageViewer(); return; }
    if(mediaRecorder && mediaRecorder.state==='recording'){ cancelVoiceRecording(); return; }
    if(callState){ endCall(); } else { closeModal(); }
  }
});

/* ===== fullscreen ===== */
function toggleFullscreen(){
  var goingFullscreen = !document.body.classList.contains('is-fullscreen');
  document.body.classList.toggle('is-fullscreen', goingFullscreen);
  var btn = document.getElementById('fullscreenBtn');
  if(btn) btn.innerHTML = icon(goingFullscreen?'collapse':'expand');
  try{
    if(goingFullscreen){
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if(req){ var p = req.call(el); if(p && p.catch) p.catch(function(){}); }
    } else if(document.fullscreenElement || document.webkitFullscreenElement){
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document);
    }
  }catch(e){}
}
function onFullscreenChange(){
  var realActive = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if(realActive) return;
  if(!document.body.classList.contains('is-fullscreen')) return;
  document.body.classList.remove('is-fullscreen');
  var btn = document.getElementById('fullscreenBtn');
  if(btn) btn.innerHTML = icon('expand');
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

/* ===== installable app ===== */
var deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
});
function setupManifest(){
  try{
    var iconSvg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='#0d0b08'/><path d='M70 256H160L195 180L260 330L300 210L340 256H442' fill='none' stroke='url(#g)' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'/><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#f3d896'/><stop offset='1' stop-color='#a9812f'/></linearGradient></defs></svg>";
    var iconDataUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(iconSvg);
    var manifest = {
      name: 'Pulse', short_name: 'Pulse', description: 'Your feed. Your vibe. Every day.',
      start_url: '.', display: 'standalone', background_color: '#0d0b08', theme_color: '#0d0b08',
      orientation: 'portrait',
      icons: [
        {src: iconDataUrl, sizes:'512x512', type:'image/svg+xml', purpose:'any'},
        {src: iconDataUrl, sizes:'512x512', type:'image/svg+xml', purpose:'maskable'}
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
    ['apple-touch-icon','icon'].forEach(function(rel){
      var l = document.createElement('link');
      l.rel = rel;
      l.href = iconDataUrl;
      document.head.appendChild(l);
    });
  }catch(e){}
}
function openInstallModal(){
  if(deferredInstallPrompt){
    var p = deferredInstallPrompt;
    deferredInstallPrompt = null;
    p.prompt();
    return;
  }
  var html = '<div class="sheet">' +
    '<div class="sheet-handle"></div>' +
    '<div class="sheet-head"><h3>Get Pulse on Your Phone</h3><button data-action="close-modal" aria-label="Close">'+icon('close')+'</button></div>' +
    '<div class="sheet-body">' +
      '<div class="install-step"><b>On iPhone</b><p>Tap the Share icon in your browser toolbar, then choose "Add to Home Screen".</p></div>' +
      '<div class="install-step"><b>On Android</b><p>Tap the ⋮ menu in your browser, then choose "Install app" or "Add to Home screen".</p></div>' +
      '<div class="install-step"><b>On a computer</b><p>Look for an install icon in the address bar, or use the browser menu → "Install Pulse".</p></div>' +
    '</div>' +
  '</div>';
  openModal(html);
}

/* ===== boot ===== */
async function boot(){
  state = await loadState();
  document.documentElement.dataset.theme = state.theme;
  setupManifest();
  var photoInput = document.getElementById('photoFileInput');
  if(photoInput) photoInput.addEventListener('change', handlePhotoSelected);
  if(state.onboarded){
    document.getElementById('onboarding').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    var streakNow = updateStreak();
    renderTopbar();
    renderBottomNav();
    renderActive();
    if(streakNow && streakNow>1){
      setTimeout(function(){ showToast('🔥 Day ' + streakNow + ' streak! Keep it up'); }, 500);
    }
  } else {
    document.getElementById('appRoot').classList.add('hidden');
    document.getElementById('onboarding').classList.remove('hidden');
    setupOnboardingGrids();
  }
  setTimeout(function(){ document.getElementById('splash').classList.add('hide'); }, 650);
}
boot();

})();
</script>
