<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var s=JSON.parse(localStorage.getItem('pulse.v1'));if(s&&s.theme==='light')document.documentElement.dataset.theme='light';}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0b08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<title>Pulse — Premium Messenger</title>
<style>
:root{
  --bg:#0d0b08;
  --surface:#18140f;
  --surface-2:#221b13;
  --border:#332a1c;
  --text:#f4eee0;
  --text-dim:#ab9d84;
  --text-faint:#78694f;
  --pink:#c9a26a;
  --purple:#c9a26a;
  --cyan:#e3c383;
  --orange:#d4af6e;
  --like:#b8394f;
  --gold-light:#f3d896;
  --gold:#d4af6e;
  --gold-deep:#a9812f;
  --emerald:#2f9e72;
  --grad-brand:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,var(--gold-deep));
  --font-display:Georgia,'Iowan Old Style','Times New Roman',Times,serif;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --shadow-1:0 10px 34px rgba(0,0,0,.45);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#f7f2e7;
  --surface:#fffdf9;
  --surface-2:#f0e6d2;
  --border:#e2d3ab;
  --text:#251d10;
  --text-dim:#6b5c41;
  --text-faint:#a4926e;
  --shadow-1:0 10px 30px rgba(60,45,10,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;
  transition:background .25s ease,color .25s ease;
}
body.noscroll{overflow:hidden;}
button,input,textarea{font-family:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;padding:0;}
button:active{transform:scale(.96);}
input,textarea{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-s);padding:12px 14px;font-size:15px;outline:none;width:100%;}
input:focus,textarea:focus{border-color:var(--gold);}
textarea{resize:none;font-family:inherit;}
h2{font-size:20px;margin:22px 0 12px;}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.hidden{display:none !important;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
.icon{width:22px;height:22px;flex:0 0 auto;}
.icon.filled{fill:currentColor;}

/* ===== layout frame ===== */
.frame{
  width:100%;
  max-width:430px;
  height:100vh;
  height:100dvh;
  margin-inline:auto;
  position:relative;
  overflow:hidden;
  background:var(--bg);
  display:flex;
  flex-direction:column;
}
@media (min-width:560px){
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(212,175,110,.14), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(184,57,79,.10), transparent 45%),
      var(--bg);
    background-attachment:fixed;
  }
  .frame{
    height:min(900px,94dvh);
    border-radius:44px;
    box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 0 8px #000;
    border:1px solid rgba(255,255,255,.06);
  }
}

/* ===== splash ===== */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .4s ease;
}
#splash.hide{opacity:0;pointer-events:none;}
.splash-logo{
  font-family:var(--font-display);font-style:italic;
  font-size:42px;font-weight:700;letter-spacing:.5px;
  background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pulseScale 1.1s ease-in-out infinite;
}
@keyframes pulseScale{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

/* ===== onboarding ===== */
.ob{padding:28px 24px;display:flex;flex-direction:column;justify-content:center;gap:0;}
.ob-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;height:100%;justify-content:center;}
.ob-hero{margin-bottom:36px;}
.ob-logo{font-family:var(--font-display);font-style:italic;font-size:54px;font-weight:700;letter-spacing:.5px;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;}
.ob-tagline{color:var(--text-dim);font-size:16px;}
.ob-progress{display:flex;gap:8px;margin-bottom:18px;}
.ob-progress .dot{width:8px;height:8px;border-radius:50%;background:var(--border);}
.ob-progress .dot.active{background:var(--grad-brand);width:22px;border-radius:5px;transition:all .25s ease;}
.ob h2{font-size:19px;margin:18px 0 10px;}
.ob-sub{color:var(--text-faint);font-size:13px;margin:0 0 14px;}
.ob #obName{margin-top:4px;text-align:center;font-size:16px;}
.ob-step[data-step="1"]{width:100%;}
.ob-step[data-step="2"]{width:100%;max-width:360px;margin-inline:auto;}
.ob .primary-btn{margin-top:26px;width:100%;max-width:320px;}

/* ===== buttons / chips ===== */
.primary-btn{
  background:var(--grad-brand);color:#1a1206;font-weight:700;font-size:15px;
  padding:15px 20px;border-radius:14px;transition:transform .15s ease,opacity .2s ease;
  box-shadow:0 8px 24px rgba(212,175,110,.3);
}
.primary-btn:disabled{opacity:.35;box-shadow:none;}
.secondary-btn{
  background:var(--surface-2);color:var(--text);font-weight:600;font-size:14px;
  padding:11px 16px;border-radius:12px;border:1px solid var(--border);
}
.danger-btn{background:var(--like);color:#fff;font-weight:700;padding:11px 18px;border-radius:12px;}
.settings-item.danger{color:var(--like);}

.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 4px;}
.emoji-opt{font-size:24px;background:var(--surface-2);border:2px solid transparent;border-radius:14px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:.15s ease;}
.emoji-opt.active{border-color:var(--gold);background:var(--surface);transform:scale(1.05);}

.chip-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 8px;}
.chip{background:var(--surface-2);color:var(--text-dim);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;border:1px solid var(--border);transition:.15s ease;white-space:nowrap;}
.chip.active{background:var(--grad-brand);color:#1a1206;border-color:transparent;}
.chip.lg{font-size:14px;padding:10px 16px;}

/* ===== app shell ===== */
#appRoot{display:contents;}
.phone{background:var(--bg);}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 14px) 18px 12px;
  flex:0 0 auto;
}
.brand{font-family:var(--font-display);font-style:italic;font-size:23px;font-weight:700;letter-spacing:.4px;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;}
.streak-badge{display:flex;align-items:center;gap:5px;background:var(--surface-2);padding:7px 12px;border-radius:999px;border:1px solid var(--border);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;}
.streak-badge .icon{width:17px;height:17px;color:var(--orange);fill:var(--orange);}
.views{flex:1;min-height:0;}
.view{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ===== bottom nav ===== */
.bottomnav{
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 10px calc(var(--safe-b) + 8px);
  border-top:1px solid var(--border);
  background:var(--bg);
  flex:0 0 auto;
}
.navbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:600;flex:1;padding:6px 0;}
.navbtn .icon{color:var(--text-faint);}
.navbtn.active{color:var(--text);}
.navbtn.active .icon{color:var(--text);}
.nav-avatar{font-size:20px;line-height:1;filter:grayscale(1);opacity:.6;}
.navbtn.active .nav-avatar{filter:none;opacity:1;}
.nav-badge{position:absolute;top:-2px;right:calc(50% - 20px);background:var(--like);color:#fff;font-size:9.5px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;width:42px;height:42px;}
.avatar.sm{width:30px;height:30px;font-size:15px;}
.avatar.lg{width:84px;height:84px;font-size:38px;margin-bottom:12px;border:3px solid var(--surface);}
.avatar.xl{width:112px;height:112px;font-size:52px;}

/* ===== chats list ===== */
.chats-list{padding:6px 8px 24px;}
.thread-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border-radius:14px;text-align:left;}
.thread-row:active{background:var(--surface-2);}
.thread-avatar-wrap{position:relative;flex:0 0 auto;}
.online-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--emerald);border:2px solid var(--bg);}
.thread-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.thread-name{font-weight:600;font-size:14.5px;}
.thread-name.unread{font-weight:800;}
.thread-preview{font-size:13px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.thread-preview.unread{color:var(--text);font-weight:600;}
.thread-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;}
.thread-time{font-size:11px;color:var(--text-faint);}
.unread-dot{width:9px;height:9px;border-radius:50%;background:var(--grad-brand);}
.add-friend-row{border:1px dashed var(--border);margin-top:4px;}
.add-avatar{background:var(--surface-2);border:1px solid var(--border);color:var(--gold);}
.empty-hint{color:var(--text-faint);font-size:13.5px;text-align:center;padding:60px 30px;}

/* ===== calls list ===== */
.calls-list{padding:6px 16px 24px;}
.call-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.call-row-info{flex:1;min-width:0;}
.call-row-name{font-weight:600;font-size:14.5px;}
.call-row-name.missed{color:var(--like);}
.call-row-meta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-faint);margin-top:2px;}
.call-row-meta .icon{width:13px;height:13px;}
.call-row button{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:0 0 auto;}
.call-row button .icon{width:16px;height:16px;}

/* ===== thread screen ===== */
.msg-screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:2;}
.msg-top{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 12px) 14px 12px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.msg-top button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text);flex:0 0 auto;}
.msg-top h3{flex:1;text-align:center;margin:0;font-size:16px;}
.thread-top-info{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
.thread-top-name{font-weight:700;font-size:14.5px;}
.thread-top-status{font-size:11.5px;color:var(--text-faint);}
.thread-top-actions{display:flex;gap:6px;flex:0 0 auto;}

.msg-body{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;position:relative;
  background-image:radial-gradient(rgba(212,175,110,.07) 1px, transparent 1px);background-size:22px 22px;}
.msg-row{display:flex;align-items:flex-end;gap:8px;position:relative;}
.msg-row.me{justify-content:flex-end;}
.msg-row.them{justify-content:flex-start;}
.msg-col{display:flex;flex-direction:column;max-width:72%;}
.msg-row.me .msg-col{align-items:flex-end;}
.msg-row.them .msg-col{align-items:flex-start;}
.bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.35;cursor:pointer;}
.msg-row.me .bubble{background:var(--grad-brand);color:#1a1206;border-bottom-right-radius:5px;}
.msg-row.them .bubble{background:var(--surface-2);border-bottom-left-radius:5px;}
.reply-quote{border-left:3px solid rgba(0,0,0,.28);background:rgba(0,0,0,.12);border-radius:8px;padding:5px 9px;margin-bottom:6px;font-size:12px;opacity:.9;}
.msg-row.them .reply-quote{border-left-color:var(--gold);background:rgba(212,175,110,.1);}
.reply-quote b{display:block;font-size:11.5px;}
.sticker-bubble{font-size:50px;line-height:1;cursor:pointer;}
.msg-meta{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-faint);margin-top:3px;padding:0 4px;font-variant-numeric:tabular-nums;}
.msg-more-btn{color:var(--text-faint);font-size:14px;padding:0 2px;line-height:1;}
.msg-ticks{display:inline-flex;color:var(--text-faint);}
.msg-ticks.tick-read{color:var(--gold);}
.msg-ticks .icon{width:14px;height:14px;}
.msg-reaction{position:absolute;bottom:-10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 5px;font-size:12px;box-shadow:var(--shadow-1);}
.msg-row.me .msg-reaction{right:36px;}
.msg-row.them .msg-reaction{left:36px;}
.msg-system{align-self:center;background:var(--surface-2);color:var(--text-faint);font-size:12px;padding:6px 14px;border-radius:999px;margin:6px 0;}
.encrypted-banner{display:flex;align-items:center;gap:6px;text-align:center;max-width:80%;background:none;font-size:11.5px;padding:10px 14px 16px;line-height:1.4;}
.encrypted-banner .icon{width:13px;height:13px;color:var(--gold);flex:0 0 auto;}
.typing-row .bubble{display:flex;gap:4px;padding:14px 16px;align-items:center;cursor:default;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:typingBounce 1.2s ease infinite;}
.typing-dot:nth-child(2){animation-delay:.15s;}
.typing-dot:nth-child(3){animation-delay:.3s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}

.audio-bubble{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:18px;min-width:190px;cursor:pointer;border:none;}
.msg-row.me .audio-bubble{background:var(--grad-brand);color:#1a1206;border-bottom-right-radius:5px;}
.msg-row.them .audio-bubble{background:var(--surface-2);color:var(--text);border-bottom-left-radius:5px;}
.audio-play-btn{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:inherit;}
.msg-row.them .audio-play-btn{background:var(--surface);}
.audio-play-icon .icon{width:13px;height:13px;}
.audio-wave{display:flex;align-items:center;gap:2px;height:22px;flex:1;}
.wave-bar{width:3px;border-radius:2px;background:currentColor;opacity:.55;}
.audio-duration{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.85;}

.image-bubble{padding:0;border-radius:16px;overflow:hidden;border:none;display:block;max-width:220px;}
.image-bubble img{display:block;width:100%;max-height:280px;object-fit:cover;}
.image-viewer{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:4;}
.image-viewer img{max-width:92%;max-height:82%;border-radius:12px;}
.image-viewer button{position:absolute;top:calc(var(--safe-t) + 14px);right:16px;color:#fff;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;}

.msg-options-overlay{position:absolute;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;}
.msg-options-overlay .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);}
.msg-options-sheet{position:relative;width:100%;max-width:430px;background:var(--surface);border-radius:22px 22px 0 0;padding-bottom:var(--safe-b);display:flex;flex-direction:column;}
.reaction-row{display:flex;justify-content:space-between;padding:14px 18px 6px;}
.reaction-row button{font-size:28px;padding:4px;border-radius:50%;transition:transform .15s ease;}
.reaction-row button:active{transform:scale(1.3);}

.reply-preview{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface-2);flex:0 0 auto;}
.reply-preview-text{flex:1;font-size:12.5px;color:var(--text-dim);border-left:3px solid var(--gold);padding-left:8px;}
.reply-preview-text b{display:block;font-size:11.5px;color:var(--text);}
.reply-preview button{color:var(--text-faint);padding:4px;}

.recording-row{display:flex;align-items:center;gap:12px;padding:12px 14px calc(var(--safe-b) + 12px);border-top:1px solid var(--border);flex:0 0 auto;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--like);animation:recPulse 1s ease-in-out infinite;flex:0 0 auto;}
@keyframes recPulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.rec-timer{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;}
.rec-hint{flex:1;font-size:12.5px;color:var(--text-faint);}
.recording-row button{padding:6px;flex:0 0 auto;}
.rec-cancel-btn{color:var(--text-faint);}
.rec-send-btn{width:34px;height:34px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;color:#1a1206;}

.sticker-panel{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:1px solid transparent;flex:0 0 auto;}
.sticker-panel.open{max-height:230px;border-top-color:var(--border);}
.sticker-tabs{display:flex;gap:8px;padding:10px 14px 6px;}
.seg{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text-faint);transition:.15s ease;background:var(--surface-2);}
.seg.active{background:var(--grad-brand);color:#1a1206;}
.sticker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 14px 14px;max-height:170px;overflow-y:auto;}
.sticker-grid button{font-size:28px;background:var(--surface-2);border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;}

.gif-anim{display:inline-block;}
.gif-flicker{animation:gifFlicker 1.1s ease-in-out infinite;}
.gif-heartbeat{animation:gifHeartbeat 1.3s ease-in-out infinite;}
.gif-wiggle{animation:gifWiggle .9s ease-in-out infinite;}
.gif-bounce{animation:gifBounce .9s ease-in-out infinite;}
.gif-shake{animation:gifShake .5s ease-in-out infinite;}
.gif-twinkle{animation:gifTwinkle 1.4s ease-in-out infinite;}
@keyframes gifFlicker{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.12) rotate(-4deg);}}
@keyframes gifHeartbeat{0%,100%{transform:scale(1);}15%{transform:scale(1.25);}30%{transform:scale(1);}45%{transform:scale(1.2);}60%{transform:scale(1);}}
@keyframes gifWiggle{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
@keyframes gifBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes gifShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@keyframes gifTwinkle{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(.85);}}

.msg-input-row{display:flex;align-items:center;gap:8px;padding:10px 14px calc(var(--safe-b) + 10px);border-top:1px solid var(--border);flex:0 0 auto;}
.msg-input-row input{flex:1;}
.msg-input-row>button{color:var(--gold);padding:6px;flex:0 0 auto;font-size:22px;line-height:1;}
.msg-input-row>button .icon{width:21px;height:21px;}
.msg-input-row .send-btn{background:var(--grad-brand);color:#1a1206;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;}
.msg-input-row .send-btn .icon{width:16px;height:16px;}

/* ===== call screen ===== */
.call-screen{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;padding:calc(var(--safe-t) + 40px) 24px calc(var(--safe-b) + 36px);}
.call-bg{position:absolute;inset:0;}
.call-bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4);}
.call-info{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:60px;}
.call-avatar-ring{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);}
.call-screen[data-state="ringing"] .call-avatar-ring{animation:callPulse 1.6s ease-out infinite;}
@keyframes callPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35);}100%{box-shadow:0 0 0 26px rgba(255,255,255,0);}}
.call-name{color:#fff;font-size:22px;font-weight:800;}
.call-status{color:rgba(255,255,255,.85);font-size:14.5px;font-variant-numeric:tabular-nums;}
.call-self-preview{position:absolute;top:calc(var(--safe-t) + 20px);right:20px;width:64px;height:88px;border-radius:14px;background:var(--surface-2);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:28px;z-index:2;}
.call-controls{position:relative;z-index:1;display:flex;gap:16px;}
.call-toggle{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;background:rgba(255,255,255,.16);width:64px;height:64px;border-radius:50%;justify-content:center;font-size:20px;}
.call-toggle span{font-size:10.5px;font-weight:600;}
.call-toggle.active{background:#fff;color:#111;}
.end-call-btn{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:var(--like);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(255,56,96,.5);}
.end-call-btn .icon{width:24px;height:24px;color:#fff;transform:rotate(135deg);}

/* ===== modal / sheets ===== */
.modal-root{position:absolute;inset:0;z-index:600;pointer-events:none;}
.modal-root.open{pointer-events:auto;}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .25s ease;}
.modal-root.open .backdrop{background:rgba(0,0,0,.55);}
.sheet{
  position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);
  width:100%;max-width:430px;max-height:82%;
  background:var(--surface);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.9,.3,1);
  padding-bottom:var(--safe-b);
}
.modal-root.open .sheet{transform:translate(-50%,0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:10px auto 2px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;}
.sheet-head h3{margin:0;font-size:16px;}
.sheet-body{padding:6px 18px 22px;overflow-y:auto;}
.sheet-body .field-label{display:block;font-size:12.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px;}
.sheet-body textarea,.sheet-body input{margin-bottom:2px;}
.sheet .primary-btn{width:100%;margin-top:22px;}

.confirm-box{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:88%;max-width:340px;background:var(--surface);border-radius:20px;padding:22px;
  text-align:center;box-shadow:var(--shadow-1);
}
.confirm-title{font-weight:800;font-size:16px;margin-bottom:8px;}
.confirm-msg{color:var(--text-dim);font-size:13.5px;line-height:1.4;margin-bottom:18px;}
.confirm-btns{display:flex;gap:10px;}
.confirm-btns button{flex:1;}

/* ===== settings / profile ===== */
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 24px 10px;}
.profile-name{font-size:19px;font-weight:800;}
.profile-bio{color:var(--text-dim);font-size:13.5px;margin-top:3px;max-width:280px;}
.profile-stats{display:flex;gap:28px;margin:16px 0;}
.stat{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--text-faint);font-weight:600;}
.stat b{font-size:17px;color:var(--text);font-weight:800;font-variant-numeric:tabular-nums;}
.profile-btns{display:flex;gap:10px;margin-bottom:14px;}
.settings-row{padding:20px 16px 30px;display:flex;flex-direction:column;gap:2px;}
.settings-item{display:flex;align-items:center;gap:12px;padding:14px 6px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--border);}
.settings-item .icon{color:var(--text-dim);}
.settings-item.danger .icon{color:var(--like);}
.install-step{padding:12px 2px;border-bottom:1px solid var(--border);}
.install-step:last-child{border-bottom:none;}
.install-step b{display:block;font-size:13.5px;margin-bottom:4px;}
.install-step p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.45;}

/* ===== toast ===== */
.toast{
  position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);
  background:#1c1710;color:#fff;padding:12px 20px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:all .3s ease;z-index:9500;
  max-width:86%;text-align:center;border:1px solid rgba(212,175,110,.25);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms !important;}
  .splash-logo{animation-duration:.001ms !important;}
}

/* ===== helpers ===== */
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function timeAgo(ts){
  var diff = Math.max(0, Date.now()-ts);
  var m = Math.floor(diff/60000);
  if(m<1) return 'now';
  if(m<60) return m+'m';
  var h = Math.floor(m/60);
  if(h<24) return h+'h';
  var d = Math.floor(h/24);
  return d+'d';
}
function formatClockTime(ts){
  var d = new Date(ts);
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h>=12?'PM':'AM';
  var h12 = h%12; if(h12===0) h12=12;
  return h12+':'+(m<10?'0':'')+m+' '+ampm;
}
function formatAudioDuration(sec){
  sec = Math.max(0, Math.round(sec||0));
  var m = Math.floor(sec/60), s = sec%60;
  return m+':'+(s<10?'0':'')+s;
}
function todayStr(d){ var x=d||new Date(); return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); }

/* ===== state + encryption ===== */
function defaultState(){
  return {
    onboarded:false,
    user:{name:'', avatar:'🔥', bio:'just here for the vibes ✨'},
    theme:'dark',
    streak:{count:0,last:null},
    view:'chats',
    threads: initThreads(),
    customFriends: []
  };
}
var KEY_STORAGE_KEY = 'pulse.key';
var cryptoKeyPromise = null;
function bufToB64(buf){
  var bytes = new Uint8Array(buf), s = '';
  for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function b64ToBuf(b64){
  var s = atob(b64), bytes = new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) bytes[i] = s.charCodeAt(i);
  return bytes;
}
function cryptoAvailable(){
  return !!(window.crypto && window.crypto.subtle);
}
function getOrCreateKey(){
  if(cryptoKeyPromise) return cryptoKeyPromise;
  cryptoKeyPromise = (async function(){
    if(!cryptoAvailable()) return null;
    try{
      var stored = localStorage.getItem(KEY_STORAGE_KEY);
      if(stored){
        return await crypto.subtle.importKey('raw', b64ToBuf(stored), {name:'AES-GCM'}, true, ['encrypt','decrypt']);
      }
      var key = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
      var exported = await crypto.subtle.exportKey('raw', key);
      localStorage.setItem(KEY_STORAGE_KEY, bufToB64(exported));
      return key;
    }catch(e){ return null; }
  })();
  return cryptoKeyPromise;
}
async function encryptString(plain){
  var key = await getOrCreateKey();
  if(!key) return null;
  try{
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(plain));
    var cipherBytes = new Uint8Array(cipherBuf);
    var combined = new Uint8Array(iv.length + cipherBytes.length);
    combined.set(iv, 0); combined.set(cipherBytes, iv.length);
    return bufToB64(combined);
  }catch(e){ return null; }
}
async function decryptString(b64){
  var key = await getOrCreateKey();
  if(!key) return null;
  try{
    var combined = b64ToBuf(b64);
    var iv = combined.slice(0,12), data = combined.slice(12);
    var plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, data);
    return new TextDecoder().decode(plainBuf);
  }catch(e){ return null; }
}
async function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var jsonStr = raw;
      if(localStorage.getItem(STORAGE_KEY+'.enc')==='1'){
        var decrypted = await decryptString(raw);
        if(!decrypted) return defaultState();
        jsonStr = decrypted;
      }
      var parsed = JSON.parse(jsonStr);
      var merged = defaultState();
      for(var k in parsed){ merged[k] = parsed[k]; }
      if(!merged.threads) merged.threads = initThreads();
      if(!merged.customFriends) merged.customFriends = [];
      return merged;
    }
  }catch(e){}
  return defaultState();
}
var state = defaultState();
function save(){
  try{
    var json = JSON.stringify(state);
    encryptString(json).then(function(cipher){
      try{
        if(cipher){ localStorage.setItem(STORAGE_KEY, cipher); localStorage.setItem(STORAGE_KEY+'.enc','1'); }
        else { localStorage.setItem(STORAGE_KEY, json); localStorage.removeItem(STORAGE_KEY+'.enc'); }
      }catch(e){}
    }).catch(function(){
      try{ localStorage.setItem(STORAGE_KEY, json); localStorage.removeItem(STORAGE_KEY+'.enc'); }catch(e){}
    });
  }catch(e){}
}
function updateStreak(){
  var today = todayStr();
  if(state.streak.last === today) return null;
  var y = new Date(); y.setDate(y.getDate()-1);
  var yest = todayStr(y);
  if(state.streak.last === yest){ state.streak.count += 1; }
  else { state.streak.count = 1; }
  state.streak.last = today;
  save();
  return state.streak.count;
}

/* ===== modal system ===== */
function openModal(html){
  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="backdrop" data-action="close-modal"></div>' + html;
  root.classList.add('open');
  document.body.classList.add('noscroll');
}
function closeModal(){
  clearTimeout(storyTimer); storyTimer=null;
  if(callState){
    clearTimeout(callState.ringTimeout);
    clearInterval(callState.timerInt);
    stopRingTone();
    callState = null;
  }
  if(mediaRecorder && mediaRecorder.state==='recording'){ cancelVoiceRecording(); }
  var root = document.getElementById('modalRoot');
  root.classList.remove('open');
  document.body.classList.remove('noscroll');
  setTimeout(function(){ if(!root.classList.contains('open')) root.innerHTML=''; }, 300);
}

  '</div>';

  document.getElementById('confirmYes').addEventListener('click', onConfirm);

/* ===== chats (base view) ===== */
function threadPreview(friendId){
  var th = state.threads[friendId];
  if(!th || !th.messages.length) return 'Say hi 👋';
  var last = th.messages[th.messages.length-1];
  if(last.type==='text') return (last.from==='me'?'You: ':'') + last.text;
  if(last.type==='call') return last.text;
  if(last.type==='image') return (last.from==='me'?'You: ':'') + '📷 Photo';
  if(last.type==='audio') return (last.from==='me'?'You: ':'') + '🎤 Voice message';
  return (last.from==='me'?'You: ':'') + 'sent a sticker';
}
function unreadThreadCount(){
  var n = 0;
  getAllFriends().forEach(function(f){ if(state.threads[f.id] && state.threads[f.id].unread) n++; });
  return n;
}
function renderChats(){
  var el = document.getElementById('view-chats');
  var friends = getAllFriends();
  var rows = friends.map(function(f){
    var th = state.threads[f.id];
    var unread = th && th.unread;
    var last = th && th.messages.length ? th.messages[th.messages.length-1] : null;
    return '<button type="button" class="thread-row" data-action="open-thread" data-id="'+f.id+'">' +
      '<span class="thread-avatar-wrap"><span class="avatar" style="background:'+f.gradient+'">'+f.avatar+'</span>'+(f.online?'<span class="online-dot"></span>':'')+'</span>' +
      '<span class="thread-info"><span class="thread-name '+(unread?'unread':'')+'">'+escapeHtml(f.name)+'</span><span class="thread-preview '+(unread?'unread':'')+'">'+escapeHtml(threadPreview(f.id))+'</span></span>' +
      '<span class="thread-meta"><span class="thread-time">'+(last?timeAgo(last.ts):'')+'</span>'+(unread?'<span class="unread-dot"></span>':'')+'</span>' +
    '</button>';

    th.messages.forEach(function(m){
      if(m.type==='call') logs.push({friend:f, text:m.text, ts:m.ts});

function audioWaveformBars(seed){

  }
  return bars;
}

  var row = '<div class="msg-row '+(mine?'me':'them')+'">';

function scheduleMsgTicks(friendId, msgId){

function patchMsgTicks(friendId, msgId, status){

  if(!th) return;

function handlePhotoSelected(e){
  var file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || !activeThreadId) return;
  if(!/^image\//.test(file.type)){ showToast('Please choose an image file'); return; }
  var friendId = activeThreadId;
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var maxDim = 900;
      var scale = Math.min(1, maxDim/Math.max(img.width,img.height));
      var w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
      var canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.78);
      sendImageMessage(friendId, dataUrl);
    };
    img.onerror = function(){ showToast('Could not load that photo'); };
    img.src = reader.result;
  };
  reader.onerror = function(){ showToast('Could not read that photo'); };
  reader.readAsDataURL(file);
}

function toggleAudioPlayback(msgId, rowEl){
  var m = findMessageInActiveThread(msgId);
  if(!m || m.type!=='audio') return;
  var btn = rowEl.querySelector('.audio-play-icon');
  if(!btn) return;
  if(activeAudioEl && activeAudioBtnEl===btn){
    if(activeAudioEl.paused){ activeAudioEl.play().catch(function(){}); } else { activeAudioEl.pause(); }
    return;
  }
  if(activeAudioEl){ activeAudioEl.pause(); }
  if(activeAudioBtnEl){ activeAudioBtnEl.innerHTML = icon('play','filled'); }
  activeAudioEl = new Audio(m.content);
  activeAudioBtnEl = btn;
  activeAudioEl.play().catch(function(){ showToast('Could not play this voice message'); });
  activeAudioEl.onended = function(){ if(btn) btn.innerHTML = icon('play','filled'); };
  activeAudioEl.onpause = function(){ if(btn) btn.innerHTML = icon('play','filled'); };
  activeAudioEl.onplay = function(){ if(btn) btn.innerHTML = icon('pause'); };
}
var mediaRecorder = null;
var recordedChunks = [];
var recordingTimerInt = null;
var recordingSeconds = 0;
var recordingStream = null;
var recordingFriendId = null;
function stopStreamTracks(){
  if(recordingStream){ recordingStream.getTracks().forEach(function(t){ t.stop(); }); recordingStream=null; }
}
function startVoiceRecording(friendId){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('Voice messages need microphone access, not available here');
    return;
  }
  recordingFriendId = friendId;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recordingStream = stream;
    recordedChunks = [];
    try{ mediaRecorder = new MediaRecorder(stream); }
    catch(e){ showToast('Voice recording is not supported in this browser'); stopStreamTracks(); return; }
    mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = function(){
      var mime = mediaRecorder.mimeType || 'audio/webm';
      var blob = new Blob(recordedChunks, {type:mime});
      var secs = recordingSeconds;
      stopStreamTracks();
      if(secs>=1) finishVoiceRecording(recordingFriendId, blob, secs);
    };
    mediaRecorder.start();
    recordingSeconds = 0;
    showRecordingUI();
    updateRecordingTimer(0);
    recordingTimerInt = setInterval(function(){
      recordingSeconds++;
      updateRecordingTimer(recordingSeconds);
      if(recordingSeconds>=60) stopVoiceRecording();
    }, 1000);
  }).catch(function(){
    showToast('Microphone access was blocked — check your browser permissions');
  });
}
function stopVoiceRecording(){
  clearInterval(recordingTimerInt);
  hideRecordingUI();
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
}
function cancelVoiceRecording(){
  clearInterval(recordingTimerInt);
  hideRecordingUI();
  recordedChunks = [];
  if(mediaRecorder && mediaRecorder.state!=='inactive'){
    mediaRecorder.onstop = function(){ stopStreamTracks(); };
    mediaRecorder.stop();
  } else {
    stopStreamTracks();
  }
}
function finishVoiceRecording(friendId, blob, duration){
  var reader = new FileReader();
  reader.onload = function(){
    var f = findFriend(friendId); if(!f) return;
    var m = {id:uid(), from:'me', type:'audio', content:reader.result, duration:duration, ts:Date.now()};
    finalizeSentMessage(friendId, f, m);
  };
  reader.onerror = function(){ showToast('Could not save that voice message'); };
  reader.readAsDataURL(blob);
}
function showRecordingUI(){
  var row = document.getElementById('recordingRow');
  var inputRow = document.getElementById('msgInputRow');
  if(!row || !inputRow) return;
  row.innerHTML = '<span class="rec-dot"></span><span class="rec-timer" id="recTimer">0:00</span><span class="rec-hint">Recording voice message…</span>' +
    '<button class="rec-cancel-btn" data-action="cancel-recording" aria-label="Cancel">'+icon('close')+'</button>' +

/* ===== calls ===== */
var callState = null;
var audioCtx = null;
var ringInterval = null;
function playRingTick(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=520;
    o.connect(g); g.connect(audioCtx.destination);
    var t = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.4);
    o.start(t); o.stop(t+0.45);
  }catch(e){}
}
function startRingTone(){
  try{
    playRingTick();
    ringInterval = setInterval(playRingTick, 1600);
  }catch(e){}
}
function stopRingTone(){
  clearInterval(ringInterval);
  ringInterval = null;
}
function fmtDuration(sec){
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function openCall(friendId, type){
  var f = findFriend(friendId); if(!f) return;
  callState = {friendId:friendId, type:type, connected:false, startedAt:0, elapsed:0, muted:false, speaker:false, timerInt:null, ringTimeout:null};
  renderCallScreen(f, 'Calling...');
  startRingTone();
  callState.ringTimeout = setTimeout(function(){ connectCall(f); }, 2200);
}
function renderCallScreen(f, status){
  var html = '<div class="call-screen" data-state="'+(callState.connected?'connected':'ringing')+'">' +
    '<div class="call-bg" style="background:'+f.gradient+'"></div>' +
    (callState.type==='video' ? '<div class="call-self-preview">'+state.user.avatar+'</div>' : '') +
    '<div class="call-info">' +
      '<div class="call-avatar-ring"><span class="avatar xl" style="background:'+f.gradient+'">'+f.avatar+'</span></div>' +
      '<div class="call-name">'+escapeHtml(f.name)+'</div>' +
      '<div class="call-status" id="callStatus">'+status+'</div>' +
    '</div>' +
    '<div class="call-controls">' +
      '<button class="call-toggle '+(callState.muted?'active':'')+'" data-action="call-toggle-mute">🎤<span>Mute</span></button>' +
      '<button class="call-toggle '+(callState.speaker?'active':'')+'" data-action="call-toggle-speaker">🔊<span>Speaker</span></button>' +
      (callState.type==='video' ? '<button class="call-toggle" data-action="call-toggle-cam">🔄<span>Flip</span></button>' : '') +
    '</div>' +
    '<button class="end-call-btn" data-action="call-end" aria-label="End call">'+icon('phone')+'</button>' +
  '</div>';
  openModal(html);
}
function connectCall(f){
  if(!callState) return;
  callState.connected = true;
  callState.startedAt = Date.now();
  stopRingTone();
  renderCallScreen(f, '00:00');
  callState.timerInt = setInterval(function(){
    if(!callState) return;
    callState.elapsed = Math.floor((Date.now()-callState.startedAt)/1000);
    var elm = document.getElementById('callStatus');
    if(elm) elm.textContent = fmtDuration(callState.elapsed);
  }, 1000);
}
function endCall(){
  if(!callState) return;
  var f = findFriend(callState.friendId);
  clearTimeout(callState.ringTimeout);
  clearInterval(callState.timerInt);
  stopRingTone();
  var elapsed = callState.elapsed||0;
  var label = (callState.type==='video'?'🎥 Video call':'📞 Voice call') + (callState.connected ? ' · '+fmtDuration(elapsed) : ' · not answered');
  if(f){
    var th = state.threads[f.id];
    var m = {id:uid(), from:'me', type:'call', text:label, ts:Date.now()};
    th.messages.push(m);
    save();
  }
  callState = null;
  if(f) renderThreadScreen(f); else closeModal();
}
function toggleCallMute(){
  if(!callState) return;
  callState.muted = !callState.muted;
  var btn = document.querySelector('.call-toggle[data-action="call-toggle-mute"]');
  if(btn) btn.classList.toggle('active', callState.muted);
}
function toggleCallSpeaker(){
  if(!callState) return;
  callState.speaker = !callState.speaker;
  var btn = document.querySelector('.call-toggle[data-action="call-toggle-speaker"]');
  if(btn) btn.classList.toggle('active', callState.speaker);
}
function toggleCallCam(){
  var btn = document.querySelector('.call-toggle[data-action="call-toggle-cam"]');
  if(btn) btn.classList.toggle('active');
}

/* ===== installable app ===== */
var deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
});
function setupManifest(){
  try{
    var iconSvg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='#0d0b08'/><path d='M70 256H160L195 180L260 330L300 210L340 256H442' fill='none' stroke='url(#g)' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'/><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#f3d896'/><stop offset='1' stop-color='#a9812f'/></linearGradient></defs></svg>";
    var iconDataUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(iconSvg);
    var manifest = {
      name: 'Pulse', short_name: 'Pulse', description: 'Your people. Your vibe. Every day.',
      start_url: '.', display: 'standalone', background_color: '#0d0b08', theme_color: '#0d0b08',
      orientation: 'portrait',
      icons: [
        {src: iconDataUrl, sizes:'512x512', type:'image/svg+xml', purpose:'any'},
        {src: iconDataUrl, sizes:'512x512', type:'image/svg+xml', purpose:'maskable'}
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
    ['apple-touch-icon','icon'].forEach(function(rel){
      var l = document.createElement('link');
      l.rel = rel;
      l.href = iconDataUrl;
      document.head.appendChild(l);
    });
  }catch(e){}
}
function openInstallModal(){
  if(deferredInstallPrompt){
    var p = deferredInstallPrompt;
    deferredInstallPrompt = null;
    p.prompt();
    return;
  }
  var html = '<div class="sheet">' +
    '<div class="sheet-handle"></div>' +
    '<div class="sheet-head"><h3>Get Pulse on Your Phone</h3><button data-action="close-modal" aria-label="Close">'+icon('close')+'</button></div>' +
    '<div class="sheet-body">' +
      '<div class="install-step"><b>On iPhone</b><p>Tap the Share icon in your browser toolbar, then choose "Add to Home Screen".</p></div>' +
      '<div class="install-step"><b>On Android</b><p>Tap the ⋮ menu in your browser, then choose "Install app" or "Add to Home screen".</p></div>' +
      '<div class="install-step"><b>On a computer</b><p>Look for an install icon in the address bar, or use the browser menu → "Install Pulse".</p></div>' +
    '</div>' +
  '</div>';
  openModal(html);
}
function getAppHtml(){
  return fetch(location.href).then(function(r){
    if(!r.ok) throw new Error('fetch failed');
    return r.text();
  }).catch(function(){
    return '<!doctype html>\n' + document.documentElement.outerHTML;
  });
}
function triggerFileDownload(html){
  try{
    var blob = new Blob([html], {type:'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Pulse.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showToast('Pulse.html saved — open it anytime, even offline 📲');
  }catch(e){
    showToast('Could not download on this device');
  }
}
function downloadAppFile(){
  getAppHtml().then(triggerFileDownload);
}
function shareAppFile(){
  getAppHtml().then(function(html){
    var canShareFile = false;
    var file = null;
    try{
      if(navigator.canShare){
        file = new File([html], 'Pulse.html', {type:'text/html'});
        canShareFile = navigator.canShare({files:[file]});
      }
    }catch(e){}
    if(navigator.share && canShareFile){
      navigator.share({files:[file], title:'Pulse', text:'Check out Pulse 💓'}).catch(function(){});
      return;
    }
    if(navigator.share && /^https?:/.test(location.href)){
      navigator.share({title:'Pulse', text:'Check out Pulse 💓', url:location.href}).catch(function(){});
      return;
    }
    triggerFileDownload(html);
    showToast('Saved — send Pulse.html to your friend however you like 📤');
  });
}

/* ===== global event delegation ===== */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.dataset.action;
  var id = t.dataset.id;
  switch(action){
    case 'nav': setView(t.dataset.view); break;
    case 'close-modal': closeModal(); break;
    case 'toggle-sticker-panel': toggleStickerPanel(); break;
    case 'sticker-tab': setStickerTab(t.dataset.tab); break;
    case 'send-msg': sendMsg(id); break;
    case 'send-sticker': sendSticker(id, t.dataset.emoji, t.dataset.anim); break;
    case 'open-thread': openThread(id); break;
    case 'add-friend': openAddFriend(); break;
    case 'remove-friend': removeFriend(id); break;
    case 'call-start': openCall(id, t.dataset.type); break;
    case 'call-end': endCall(); break;
    case 'call-toggle-mute': toggleCallMute(); break;
    case 'call-toggle-speaker': toggleCallSpeaker(); break;
    case 'call-toggle-cam': toggleCallCam(); break;
    case 'msg-options': openMsgOptions(id, t.dataset.mine); break;
    case 'close-msg-options': closeMsgOptions(); break;
    case 'react-msg': reactToMessage(t.dataset.emoji); break;
    case 'reply-to-msg': startReply(); break;
    case 'copy-msg': copyMessageText(); break;
    case 'delete-msg': deleteMessage(); break;
    case 'cancel-reply': cancelReply(); break;
    case 'trigger-photo': triggerPhotoPicker(); break;
    case 'view-image': openImageViewerFor(id); break;
    case 'close-image-viewer': closeImageViewer(); break;
    case 'stop-recording': stopVoiceRecording(); break;
    case 'cancel-recording': cancelVoiceRecording(); break;
    case 'play-audio': toggleAudioPlayback(id, t); break;
    case 'mic-or-send':
      var micInput = document.getElementById('msgInput');
      if(micInput && micInput.value.trim()){ sendMsg(id); } else { startVoiceRecording(id); }
      break;
    case 'edit-profile': openEditProfile(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'confirm-reset': confirmReset(); break;
    case 'install': openInstallModal(); break;
    case 'download-app': downloadAppFile(); break;
    case 'share-app': shareAppFile(); break;
    case 'ob-next': if(!t.disabled) goToStep(Number(t.dataset.goto)); break;
    case 'ob-finish': if(!t.disabled) finishOnboarding(); break;
  }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(document.getElementById('msgOptionsOverlay')){ closeMsgOptions(); return; }
    if(document.querySelector('.image-viewer')){ closeImageViewer(); return; }
    if(mediaRecorder && mediaRecorder.state==='recording'){ cancelVoiceRecording(); return; }
    if(callState){ endCall(); } else { closeModal(); }
  }
});

/* ===== boot ===== */
async function boot(){
  state = await loadState();
  document.documentElement.dataset.theme = state.theme;
  setupManifest();
  var photoInput = document.getElementById('photoFileInput');
  if(photoInput) photoInput.addEventListener('change', handlePhotoSelected);
  if(state.onboarded){
    document.getElementById('onboarding').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    var streakNow = updateStreak();
    renderTopbar();
    syncViewVisibility(state.view);
    renderBottomNav();
    renderActive();
    if(streakNow && streakNow>1){
      setTimeout(function(){ showToast('🔥 Day ' + streakNow + ' streak! Keep it up'); }, 500);
    }
  } else {
    document.getElementById('appRoot').classList.add('hidden');
    document.getElementById('onboarding').classList.remove('hidden');
    goToStep(1);
    setupOnboardingGrids();
  }
  setTimeout(function(){ document.getElementById('splash').classList.add('hide'); }, 650);
}
boot();

})();
