# Snug registry: one Worker + one SQLite Durable Object instance ("Hub").
# Deploy: see README.md. Account-specific values are placeholders; secrets are never in this file.
name = "snug-registry"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# No request logs: requests carry GitHub tokens (in bodies) and IP addresses. See README "Logging".
[observability]
enabled = false

[vars]
GITHUB_API = "https://api.github.com"
# The public client id of YOUR GitHub OAuth App (Device Flow enabled). Tokens of other apps are refused.
GITHUB_CLIENT_ID = "Ov23liULMWaI5WTLL6vO"
# Optional Cloudflare TURN key id; empty = /v1/turn answers 404. Its token is the TURN_KEY_TOKEN secret.
TURN_KEY_ID = "8d4d95f8e798e01d313f8f2374d952ba"
# Estimated DO requests per UTC day after which the fallback relay is refused (free tier guard).
RELAY_OFF_AT = "60000"
# Signal keepalive interval sent to clients (seconds).
PING_SECONDS = "90"
# 0.12 GIF search for desktop PCs (src/gif.js): openverse (default), commons (no safe-search; opt-in),
# tenor (needs the TENOR_KEY secret), comma-separated, or off. GIF_CONTACT goes into the User-Agent.
GIF_PROVIDERS = "openverse"
GIF_CONTACT = ""
# The Durable Object instance holding every account. A new name starts an empty registry (a reset).
# "hub-2": reset on 2026-11-14 at the owner's request (the old instance's test accounts are abandoned).
HUB_NAME = "hub-2"
# v0.12: keypair accounts (no GitHub account needed; registry/src/keyacct.js). "1" = on; anything else answers
# their routes with 404, exactly as before. 0.11 clients never call them either way.
KEY_ACCOUNTS = "1"
# Proof-of-work bits for a keypair sign-up (default 20; +1 per doubling of sign-ups past 30 an hour; max 28).
# Raise it (no code change) if sign-ups are abused.
POW_BITS = "20"
# Optional: free the names of keypair accounts with no connection for this many days (empty = never).
# KEY_ACCOUNT_IDLE_DAYS = "400"

# Secrets (wrangler secret put NAME), never committed:
#   GH_HMAC_SECRET    required. >= 32 random bytes. NEVER ROTATE (it keys every account's GitHub hash).
#   GH_CLIENT_SECRET  required. The OAuth App client secret; used only to check and revoke tokens.
#   OWNER_GITHUB_IDS  required for the owner-only name "a" and every admin right (v0.10). Comma-separated numeric GitHub ids.
#   TURN_KEY_TOKEN    optional. Cloudflare TURN key API token.
#   TENOR_KEY         optional (0.12). A free Google Cloud key for Tenor GIF search (GIF_PROVIDERS=tenor).
#   GIF_TOKEN_SECRET  optional (0.12). Keys GIF search tokens; derived from GH_HMAC_SECRET when unset.

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
