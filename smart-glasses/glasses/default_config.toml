# Smart glasses defaults = the ULTRA-BUDGET build.
# Do not edit this file: put overrides in config.toml (see configs/*.toml).
# driver = "none" disables a module. `--sim` replaces every driver with a simulator.

[general]
start_mode = "normal"        # normal | lowlight | night | thermal | fusion | sensors | wall | ai
log_level = "INFO"
capture_dir = "~/glasses-captures"
mode_button_pin = 27         # GPIO: short press = next mode. -1 = no button
cpu_throttle_c = 75.0        # above this CPU temperature, camera/AI work is halved

[camera]
driver = "picamera2"         # picamera2 | imx500 | opencv | sim | none
device = 0                   # opencv only: N of /dev/videoN, or a device path
width = 640
height = 480
fps = 15
max_zoom = 4.0
imx500_model = "/usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk"
ir_led_pin = 13              # GPIO driving the IR-LED MOSFET gate. -1 = none
privacy_led_pin = 6          # GPIO of the outward "camera is on" LED. -1 = none

[thermal]
driver = "amg8833"           # amg8833 | mlx90640 | p2pro | sim | none
interval = 0.2
mlx_refresh_hz = 4           # MLX90640: 1 | 2 | 4 | 8 | 16
device = 1                   # p2pro: N of /dev/videoN, or a path such as "/dev/v4l/by-id/..."
flip_h = false               # mirror the thermal image to match the camera
flip_v = false
min_span_c = 6.0             # colour scale never narrower than this (hides noise)
fusion_scale = 0.9           # thermal overlay size as a fraction of the camera frame
fusion_offset_x = 0.0        # overlay shift, fraction of frame width (+ = right)
fusion_offset_y = 0.0        # overlay shift, fraction of frame height (+ = down)
fusion_alpha = 0.85         # opacity of the hottest areas

[distance]
driver = "vl53l0x"           # vl53l0x | vl53l1x | tfluna | sim | none
interval = 0.1

[environment]
driver = "none"              # bme280 | bme680 | sim | none
address = 0x76               # BME280: 0x76 or 0x77, BME680: usually 0x77
interval = 5.0

[radar]
driver = "rcwl0516"          # rcwl0516 | ld2410 | ld2450 | sim | none
gpio_pin = 22                # rcwl0516 OUT pin
port = "/dev/serial0"        # ld2410 / ld2450 UART
baud = 256000
interval = 0.1

[rf]
driver = "linux"             # linux | sim | none
interval = 30.0
wifi = true                  # counts nearby networks via nmcli (no MACs stored)
ble = true                   # counts BLE advertisers via bleak (no MACs stored)
ble_scan_s = 4.0
sdr = false                  # needs an RTL-SDR dongle + `rtl-sdr` package
sdr_range = "430M:440M:25k"  # rtl_power -f syntax
sdr_seconds = 5

[battery]
driver = "ina219"            # ina219 | sim | none
address = 0x40               # Waveshare UPS HAT (C) uses 0x43
mode = "powerbank"           # powerbank: INA219 on the 5 V line, counts energy used
                             # lipo: INA219 between cell and boost board, reads cell voltage
capacity_mah = 5000          # nominal cell capacity (3.7 V cells)
efficiency = 0.85            # powerbank: usable fraction after 3.7 V -> 5 V conversion
internal_resistance = 0.12   # lipo: ohms, compensates voltage sag under load
shunt_ohms = 0.1             # INA219 shunt marking: R100 = 0.1, R010 = 0.01
interval = 2.0

[wallprobe]
driver = "none"              # udp | sim | none
port = 5005
cap_threshold = 8.0          # capacitive drop vs. baseline that suggests a stud/dense material
mag_threshold = 25.0         # magnetometer change (raw units) that suggests ferrous metal
ac_threshold = 40.0          # 50 Hz field level that suggests a live conductor

[detector]
driver = "opencv"            # opencv | imx500 (the camera does it) | sim | none
mode = "on_demand"           # on_demand (when asked) | continuous
interval = 2.0               # continuous: seconds between detections
model = "models/ssd_mobilenet_v2_coco_2018_03_29/frozen_inference_graph.pb"
config = "models/ssd_mobilenet_v2_coco_2018_03_29.pbtxt"
min_score = 0.5

[hud]
driver = "ssd1306"           # ssd1306 | sh1106 (I2C mono) | ssd1351 | st7789 (SPI colour) | sim | none
width = 128
height = 64
i2c_address = 0x3C
spi_dc_pin = 24
spi_rst_pin = 25
spi_hz = 16000000            # lower to 8000000 for cables longer than ~20 cm
rotate = 0                   # 0..3, quarter turns
mirror = true                # a beam-splitter reflection flips the image left-right
contrast = 255
fps = 8

[voice]
driver = "vosk"              # vosk | sim | none
model = "models/vosk-model-small-en-us-0.15"
audio_device = "default"     # arecord -D value, e.g. "plughw:CARD=sndrpigooglevoi,DEV=0"
mic_gain = 4.0               # INMP441 is quiet; digital gain before recognition
trigger = "button"           # button (push-to-talk) | wake_word (always listening)
button_pin = 17
wake_word = "glasses"
tts = "espeak"               # espeak | piper | print
piper_model = "models/en_US-lessac-low.onnx"
speak_alerts = true

[assistant]
enabled = true               # needs ANTHROPIC_API_KEY; falls back to on-device answers
model = "claude-opus-5-5"    # claude-haiku-5-5 costs roughly 40x less per question
effort = "low"               # low | medium | high - low keeps spoken answers fast
max_tokens = 2000
image_max_px = 768           # longest image side sent to the API (fewer tokens)
history_turns = 3            # text-only conversation memory

[alerts]
obstacle_m = 0.6
hot_c = 60.0
motion_m = 2.0
battery_low_pct = 15
cooldown_s = 8.0

[web]
enabled = true
host = "0.0.0.0"
port = 8080
token = ""                   # empty = random token, printed in the log at startup
