# Builds the Snug Mac app on a real Mac: one universal .dmg (Apple silicon and Intel), ad-hoc
# signed (no Apple Developer account). It runs Snug's tests on macOS, builds, uploads the dmg,
# checks the signature, then drives the packaged app (first run, account, message, reopen).
# The dmg is attached to every run (Actions > Snug Mac app > Artifacts). On pushes to the default
# branch or claude/stoic-newton-6zup7j it is also added, with its checksum, to the release for this version.
#
# Security (sec-desktop D2, D4): the token is read-only everywhere except the release job, which runs in the
# `release` environment (see build-snug-windows.yml). Actions are pinned to commits (Dependabot updates them),
# checkouts don't keep the token, install scripts don't run except Electron's own download. The app is signed
# with the hardened runtime (entitlements.mac.plist) and its Electron fuses are checked after the build.
name: Snug Mac app

on:
  push:
    paths:
      - "snug/**"
      - ".github/workflows/build-snug-mac.yml"
  workflow_dispatch:

permissions: {}

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test Snug (rules and server) on macOS
        working-directory: snug
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Build the dmg
        working-directory: snug/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
          node build.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Snug-Mac
          path: snug/desktop/dist/Snug-*-mac.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Check the app's signature and architectures
        working-directory: snug/desktop
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-universal/Snug.app
          lipo -archs dist/mac-universal/Snug.app/Contents/MacOS/Snug
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" dist/mac-universal/Snug.app/Contents/Info.plist
          codesign -d --verbose=2 dist/mac-universal/Snug.app 2>&1 | grep -E "flags=.*runtime" # the hardened runtime is on
          codesign -d --entitlements - dist/mac-universal/Snug.app 2>&1 | grep -q "com.apple.security.device.audio-input"
          node fuses.js check dist/mac-universal/Snug.app

      # After the upload, so a problem here never hides the dmg. A failure still fails the run.
      # Playwright always passes --inspect, which the release build's fuses refuse: the test drives a copy
      # with only that fuse turned back on (re-signed ad hoc, never uploaded).
      - name: Test the packaged app
        working-directory: snug/desktop
        timeout-minutes: 8
        env:
          SNUG_BIN: dist/test-app/Snug.app/Contents/MacOS/Snug
        run: |
          mkdir -p dist/test-app
          node fuses.js test-copy dist/mac-universal/Snug.app dist/test-app/Snug.app
          node --test --test-timeout=400000 --test-force-exit test.js # on this runner the limit also covers the whole file

  # Adds the dmg, SHA256SUMS-mac.txt and (with the signing key) its signature to snug-v<version>
  # (desktop/release.sh creates the release if the Windows workflow hasn't yet), then marks it latest.
  # The app's mandatory updater reads this release.
  release:
    needs: mac
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/claude/stoic-newton-6zup7j')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: snug-release-mac
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Snug-Mac
          path: dist

      # Build provenance (free for public repositories): `gh attestation verify <file> -R DominicsUSE/Claude-apps`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true # provenance is extra proof; a hiccup there must not hold back a release
        with:
          subject-path: dist/Snug-*-mac.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SNUG_UPDATE_SIGNING_KEY: ${{ secrets.SNUG_UPDATE_SIGNING_KEY }}
        run: |
          v=$(node -p "require('./snug/desktop/package.json').version")
          bash snug/desktop/release.sh mac "dist/Snug-$v-mac.dmg"
