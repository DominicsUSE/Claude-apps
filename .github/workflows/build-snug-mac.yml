# Builds the Snug Mac app on a real Mac: one universal .dmg (Apple silicon and Intel), ad-hoc
# signed (no Apple Developer account). It runs Snug's tests on macOS, builds, uploads the dmg,
# checks the signature, then drives the packaged app (first run, account, message, reopen).
# The dmg is attached to every run (Actions > Snug Mac app > Artifacts). On pushes to the default
# branch or claude/stoic-newton-6zup7j it is also added, with its checksum, to the release for this version.
name: Snug Mac app

on:
  push:
    paths:
      - "snug/**"
      - ".github/workflows/build-snug-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Snug (rules and server) on macOS
        working-directory: snug
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Build the dmg
        working-directory: snug/desktop
        run: |
          npm ci --no-audit --no-fund
          node build.js

      - uses: actions/upload-artifact@v4
        with:
          name: Snug-Mac
          path: snug/desktop/dist/Snug-*-mac.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Check the app's signature and architectures
        working-directory: snug/desktop
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-universal/Snug.app
          lipo -archs dist/mac-universal/Snug.app/Contents/MacOS/Snug
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" dist/mac-universal/Snug.app/Contents/Info.plist

      # After the upload, so a problem here never hides the dmg. A failure still fails the run.
      - name: Test the packaged app
        working-directory: snug/desktop
        timeout-minutes: 8
        env:
          SNUG_BIN: dist/mac-universal/Snug.app/Contents/MacOS/Snug
        run: node --test --test-timeout=400000 --test-force-exit test.js # on this runner the limit also covers the whole file

  # Adds the dmg and SHA256SUMS-mac.txt to snug-v<version> (desktop/release.sh creates the release if the
  # Windows workflow hasn't yet), then marks it latest. The app's mandatory updater reads this release.
  release:
    needs: mac
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/claude/stoic-newton-6zup7j')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: snug-release-mac
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Snug-Mac
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./snug/desktop/package.json').version")
          bash snug/desktop/release.sh mac "dist/Snug-$v-mac.dmg"
