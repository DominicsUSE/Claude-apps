# Builds the Siteless Windows app on a real Windows machine: an installer and a portable exe.
# Every build attaches both to the run (Actions > Siteless Windows app > Artifacts).
# On the default branch it also publishes them as a release, so there is a stable download link.
name: Siteless Windows app

on:
  push:
    paths:
      - "siteless/**"
      - ".github/workflows/build-siteless-windows.yml"
  workflow_dispatch:

# sec-desktop D2: read-only by default; only the release job may write, and it runs nothing from npm.
permissions: {}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # sec-desktop D2: the token doesn't stay in .git/config

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build the installer and the portable app
        working-directory: siteless/desktop
        run: |
          npm ci --no-audit --no-fund
          node build.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Siteless-Windows-Installer
          path: siteless/desktop/dist/Siteless-Setup-*.exe
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Siteless-Windows-Portable
          path: siteless/desktop/dist/Siteless-*-portable.exe
          compression-level: 0
          if-no-files-found: error

  # sec-desktop D2/D11: publishing is its own job (the build job's token is read-only), and the release is
  # never marked latest: Snug's updater once read the repository's latest release.
  release:
    needs: windows
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Siteless-Windows-*
          merge-multiple: true
          path: dist

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./siteless/desktop/package.json').version")
          tag="siteless-v$v"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title "Siteless $v for Windows" --notes \
              "Download **Siteless-Setup-$v.exe** to install Siteless (Start menu and desktop shortcuts), or **Siteless-$v-portable.exe** to run it without installing. Windows may say it protected your PC because the app is not signed: choose **More info**, then **Run anyway**."
          fi
          gh release upload "$tag" dist/Siteless-Setup-*.exe dist/Siteless-*-portable.exe --clobber
