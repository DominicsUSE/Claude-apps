# Temporary: which web search answers an app, to check whether a place has a website
name: Search diagnostic
on:
  push:
    paths: [".github/workflows/search-diag.yml"]
jobs:
  diag:
    runs-on: windows-2025
    steps:
      - shell: bash
        run: |
          UA='Siteless/1.0.5 (Windows desktop app; https://github.com/DominicsUSE/Claude-apps)'
          CH='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          t() { printf '%-28s ' "$1"; curl -s -o /tmp/b -w '%{http_code} %{time_total}s %{size_download}B ' --max-time 25 -A "$2" "$3"; grep -o -i 'katzsdelicatessen\.com' /tmp/b | head -1; echo; grep -o -i -E 'captcha|unusual traffic|anomaly|are you a robot' /tmp/b | head -1; }
          for ua in "$UA" "$CH"; do
            echo "=== UA: ${ua:0:30}"
            t "ddg html" "$ua" "https://html.duckduckgo.com/html/?q=Katz%27s+Delicatessen+New+York"
            t "ddg lite" "$ua" "https://lite.duckduckgo.com/lite/?q=Katz%27s+Delicatessen+New+York"
            t "bing" "$ua" "https://www.bing.com/search?q=Katz%27s+Delicatessen+New+York"
            t "brave" "$ua" "https://search.brave.com/search?q=Katz%27s+Delicatessen+New+York"
            t "mojeek" "$ua" "https://www.mojeek.com/search?q=Katz%27s+Delicatessen+New+York"
            t "startpage" "$ua" "https://www.startpage.com/do/search?q=Katz%27s+Delicatessen+New+York"
            t "wikidata" "$ua" "https://www.wikidata.org/w/api.php?action=wbsearchentities&search=Katz%27s+Delicatessen&language=en&format=json"
          done
          echo "=== repeat ddg html 6x quickly (rate limit?)"
          for i in 1 2 3 4 5 6; do t "ddg $i" "$CH" "https://html.duckduckgo.com/html/?q=Joe%27s+Pizza+Carmine+Street+New+York+$i"; done
