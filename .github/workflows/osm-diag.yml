# Temporary: which request headers do the OpenStreetMap (Overpass) servers accept?
name: OSM server diagnostic
on:
  push:
    paths: [".github/workflows/osm-diag.yml"]
jobs:
  diag:
    runs-on: windows-2025
    steps:
      - shell: bash
        run: |
          Q='[out:json][timeout:20];node[amenity=cafe](51.512,-0.137,51.515,-0.132);out 3;'
          CHROME='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          ELECTRON='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Siteless/1.0.2 Chrome/140.0.0.0 Electron/38.8.6 Safari/537.36'
          APP='Siteless/1.0.3 (Windows desktop app; https://github.com/DominicsUSE/Claude-apps)'
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "=== $ep"
            t() { printf '%-34s ' "$1"; shift; curl -s -o /tmp/b -w '%{http_code} %{time_total}s ' --max-time 40 "$@" --data-urlencode "data=$Q" "$ep"; head -c 120 /tmp/b | tr '\n' ' '; echo; }
            t "curl default UA" 
            t "chrome UA" -A "$CHROME"
            t "electron UA" -A "$ELECTRON"
            t "electron UA + Origin siteless" -A "$ELECTRON" -H "Origin: siteless://app"
            t "chrome UA + Origin siteless" -A "$CHROME" -H "Origin: siteless://app"
            t "app UA" -A "$APP"
            t "app UA + Referer" -A "$APP" -e "https://github.com/DominicsUSE/Claude-apps"
            t "chrome UA + Origin null" -A "$CHROME" -H "Origin: null"
          done
