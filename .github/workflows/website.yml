# Publishes the Building Atlas website on GitHub Pages and refreshes its news every 10 minutes.
# One-time setup: Settings > Pages > Source: "GitHub Actions"; custom domain: buildingatlas.eu.org.
name: Building Atlas website

on:
  push:
    paths:
      - "realestate-globe/**"
      - ".github/workflows/website.yml"
  schedule:
    - cron: "*/10 * * * *"   # GitHub runs scheduled jobs from the default branch, sometimes a few minutes late
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site and fetch the latest headlines
        run: python3 realestate-globe/site/build_site.py --domain buildingatlas.eu.org --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Pages only accepts deployments from the default branch
    # (scheduled runs always come from the default branch)
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
