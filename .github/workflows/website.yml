# Publishes the Building Atlas website on GitHub Pages and refreshes its news every 10 minutes.
# One-time setup: Settings > Pages > Source: "GitHub Actions"; custom domain: buildingatlas.eu.org.
name: Building Atlas website

on:
  push:
    paths:
      - "realestate-globe/**"
      - ".github/workflows/website.yml"
  schedule:
    - cron: "*/10 * * * *"   # GitHub runs scheduled jobs from the default branch, sometimes a few minutes late
  workflow_dispatch:

# sec-desktop D2: read-only by default; only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # sec-desktop D2: the token doesn't stay in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the site and fetch the latest headlines
        run: python3 realestate-globe/site/build_site.py --domain buildingatlas.eu.org --out _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    # Pages only accepts deployments from the default branch
    # (scheduled runs always come from the default branch)
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
