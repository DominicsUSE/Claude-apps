# Builds the Snug Windows app on a real Windows machine: an installer and a portable exe.
# It runs Snug's own tests on Windows, builds, uploads the files, then drives the packaged
# app (first run, account, message, reopen) before publishing a release. Every build attaches both files to the run
# (Actions > Snug Windows app > Artifacts). On pushes to the default branch or claude/stoic-newton-6zup7j
# it also publishes them, with their checksums, as the release the app updates itself from.
#
# Security (sec-desktop D2): the token is read-only everywhere except the release job, which runs in the
# `release` environment (Settings > Environments > release: limit it to the release branches, and add
# reviewers if you want a person to approve each release). Every action is pinned to a commit; Dependabot
# (.github/dependabot.yml) proposes updates. Checkouts don't keep the token. Install scripts don't run,
# except Electron's own download.
name: Snug Windows app

on:
  push:
    paths:
      - "snug/**"
      - ".github/workflows/build-snug-windows.yml"
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test Snug (rules and server) on Windows
        working-directory: snug
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Build the installer and the portable app
        working-directory: snug/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
          node build.js

      - name: Check the Electron fuses of the built app
        working-directory: snug/desktop
        run: node fuses.js check dist/win-unpacked/Snug.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Snug-Windows-Installer
          path: snug/desktop/dist/Snug-Setup-*.exe
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Snug-Windows-Portable
          path: snug/desktop/dist/Snug-*-portable.exe
          compression-level: 0
          if-no-files-found: error

      # After the upload, so a problem here never hides the files. A failure still fails the run.
      # Playwright always passes --inspect, which the release build's fuses refuse: the test drives a copy
      # with only that fuse turned back on (never uploaded); everything else is the shipped build.
      - name: Test the packaged app
        working-directory: snug/desktop
        timeout-minutes: 6
        env:
          SNUG_BIN: dist/test-unpacked/Snug.exe
        run: |
          node fuses.js test-copy dist/win-unpacked/Snug.exe dist/test-unpacked
          node --test --test-timeout=400000 --test-force-exit test.js # on this runner the limit also covers the whole file

  # Publishes snug-v<version> with both files, SHA256SUMS-windows.txt and (with the signing key) its signature
  # (desktop/release.sh): only files the release doesn't have yet, then marks it latest. The app's mandatory
  # updater reads this release.
  release:
    needs: windows
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/claude/stoic-newton-6zup7j')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: snug-release-windows
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Snug-Windows-*
          merge-multiple: true
          path: dist

      # Build provenance (free for public repositories): `gh attestation verify <file> -R DominicsUSE/Claude-apps`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true # provenance is extra proof; a hiccup there must not hold back a release
        with:
          subject-path: dist/Snug-*.exe

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SNUG_UPDATE_SIGNING_KEY: ${{ secrets.SNUG_UPDATE_SIGNING_KEY }}
        run: |
          v=$(node -p "require('./snug/desktop/package.json').version")
          bash snug/desktop/release.sh windows "dist/Snug-Setup-$v.exe" "dist/Snug-$v-portable.exe"
