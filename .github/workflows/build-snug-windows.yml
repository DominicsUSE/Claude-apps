# Builds the Snug Windows app on a real Windows machine: an installer and a portable exe.
# Before publishing it runs Snug's own tests on Windows and then drives the packaged app
# (first run, account, message, reopen). Every build attaches both files to the run
# (Actions > Snug Windows app > Artifacts). On the default branch it also publishes them
# as a release, so there is a stable download link.
name: Snug Windows app

on:
  push:
    paths:
      - "snug/**"
      - ".github/workflows/build-snug-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Snug (rules and server) on Windows
        working-directory: snug
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Build the installer and the portable app
        working-directory: snug/desktop
        run: |
          npm ci --no-audit --no-fund
          node build.js

      - name: Test the packaged app
        working-directory: snug/desktop
        env:
          SNUG_BIN: dist/win-unpacked/Snug.exe
        run: node --test test.js

      - uses: actions/upload-artifact@v4
        with:
          name: Snug-Windows-Installer
          path: snug/desktop/dist/Snug-Setup-*.exe
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Snug-Windows-Portable
          path: snug/desktop/dist/Snug-*-portable.exe
          compression-level: 0
          if-no-files-found: error

      - name: Publish a release (default branch only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./snug/desktop/package.json').version")
          tag="snug-v$v"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Snug $v for Windows" --notes \
              "Download **Snug-Setup-$v.exe** to install Snug (Start menu and desktop shortcuts), or **Snug-$v-portable.exe** to run it without installing. Windows may say it protected your PC because the app is not signed: choose **More info**, then **Run anyway**."
          fi
          gh release upload "$tag" snug/desktop/dist/Snug-Setup-*.exe snug/desktop/dist/Snug-*-portable.exe --clobber
