# Builds the Build Atlas Mac app on a real Mac and attaches the zips to the run.
name: Build Atlas Mac app

on:
  push:
    paths:
      - "realestate-globe/**"
      - ".github/workflows/build-mac.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # sec-desktop D2: the token doesn't stay in .git/config

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install icon tooling
        run: pip install pillow

      - name: Build Apple Silicon and Intel apps
        working-directory: realestate-globe/mac
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          node build-mac.js

      - name: Check the apps are signed
        working-directory: realestate-globe/mac/dist/build
        run: |
          for app in */"Build Atlas.app"; do codesign --verify --deep --strict "$app" && echo "signed: $app"; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Build-Atlas-Mac-Apple-Silicon
          path: realestate-globe/mac/dist/*Apple-Silicon.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Build-Atlas-Mac-Intel
          path: realestate-globe/mac/dist/*Intel.zip
          compression-level: 0
          if-no-files-found: error
