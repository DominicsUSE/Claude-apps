<title>Build Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed globe over a starfield; floating search + mode switch top-left,
   legend bottom-left, detail panel docked right (bottom sheet on phones).
   One deliberate night look: deep navy space, glass panels, semantic green/amber/red. */
:root{
  --space:#04070e;
  --panel:rgba(9,15,26,.78);
  --panel-solid:#0b1322;
  --line:rgba(160,190,225,.14);
  --line-2:rgba(160,190,225,.26);
  --ink:#eaf0f7;
  --muted:#8b9bb1;
  --accent:#8ec5ff;
  --good:#38d08a;
  --mid:#f4c430;
  --bad:#f25f57;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
  --shadow:0 18px 50px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--space);color:var(--ink);font:14px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#globe{touch-action:none;cursor:grab}
#globe.dragging{cursor:grabbing}
#globe.pointing{cursor:pointer}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:var(--shadow)}

.top{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100% - 32px));z-index:3}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;flex:none}
.brand h1{margin:0;font:800 23px/1 var(--f-display);letter-spacing:-.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;padding:12px 14px 12px 40px;border-radius:var(--r);color:var(--ink);font:15px var(--f-body)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:13px;top:23px;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;z-index:1;pointer-events:none}
.results{list-style:none;margin:6px 0 0;padding:4px;border-radius:var(--r);max-height:320px;overflow:auto;background:var(--panel-solid)}
.results li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer}
.results li[aria-selected="true"],.results li:hover{background:rgba(142,197,255,.1)}
.results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .sub{color:var(--muted);font-size:12px}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:var(--r)}
.modes button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border:0;border-radius:10px;background:transparent;cursor:pointer;text-align:left;color:var(--muted);transition:background .2s,color .2s}
.modes button b{font:600 13px var(--f-body);color:inherit;display:flex;align-items:center;gap:6px}
.modes button small{font-size:11px;line-height:1.25}
.modes button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(142,197,255,.2),rgba(142,197,255,.08));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(142,197,255,.35)}

.pct{font:600 12px/1 var(--f-data);padding:4px 7px;border-radius:999px;color:#06101b;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct.g{background:var(--good)}.pct.y{background:var(--mid)}.pct.r{background:var(--bad)}

.legend{position:absolute;left:16px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:9px;padding:12px 14px;border-radius:var(--r);max-width:min(400px,calc(100% - 32px));box-sizing:border-box}
.legend .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ramp{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bad),var(--mid) 55%,var(--good))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02);cursor:pointer;font-size:12.5px}
.chip i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 8px currentColor}
.chip[aria-pressed="false"]{opacity:.38}
.chip b{font:500 11px var(--f-data);color:var(--muted)}
.note{font-size:11px;color:var(--muted);max-width:340px}
.zoomhint{font:500 11px var(--f-data);color:var(--accent)}

.ctrls{position:absolute;right:16px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:6px}
.ctrls button{width:42px;height:42px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.ctrls button:hover{border-color:var(--accent)}
.ctrls svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

.panel{position:absolute;top:16px;right:16px;bottom:16px;width:356px;z-index:2;display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
body.has-panel .ctrls{right:388px}
.panel-scroll{overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:0}
.panel h2{margin:0;font:800 26px/1.08 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.panel h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow{color:var(--muted);font-size:13px;margin-bottom:3px}
.back{align-self:flex-start;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
.hero{display:flex;align-items:center;gap:16px}
.ringwrap{position:relative;width:96px;height:96px;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ringwrap .num small{font-size:14px;color:var(--muted);font-weight:500}
.verdict{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-weight:600;font-size:13px}
.verdict.g{background:rgba(56,208,138,.14);color:var(--good)}
.verdict.y{background:rgba(244,196,48,.14);color:var(--mid)}
.verdict.r{background:rgba(242,95,87,.14);color:var(--bad)}
.verdict i{width:8px;height:8px;border-radius:50%;background:currentColor}
.meta{color:var(--muted);font-size:13px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.tile[aria-pressed="true"]{border-color:rgba(142,197,255,.5);background:rgba(142,197,255,.08)}
.tile span{font-size:11px;color:var(--muted)}
.tile b{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile b.g{color:var(--good)}.tile b.y{color:var(--mid)}.tile b.r{color:var(--bad)}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.price span{color:var(--muted);font-size:13px}
.price b{font:600 18px var(--f-data);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}
.bar .t{font-size:13px}
.bar .v{font:500 12px var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.bar .track{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(160,190,225,.1);overflow:hidden}
.bar .fill{height:100%;border-radius:3px}
.adj{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;margin:0}
.adj dt{color:var(--muted)}
.adj dd{margin:0;font:500 13px var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
.adj .tot{color:var(--ink);font-weight:600;border-top:1px solid var(--line);padding-top:7px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li:hover{background:rgba(142,197,255,.07)}
.list .rk{font:500 11px var(--f-data);color:var(--muted);width:20px;font-variant-numeric:tabular-nums}
.list .nm{flex:1;min-width:0}
.list .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .nm small{color:var(--muted);font-size:12px}
.list .side{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.list .side em{font:500 11px var(--f-data);color:var(--muted);font-style:normal}
.tabs{display:flex;gap:4px;padding:3px;border-radius:11px;background:rgba(160,190,225,.07)}
.tabs button{flex:1;padding:7px 4px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:rgba(142,197,255,.15);color:var(--ink)}
.p{margin:0;color:var(--muted);font-size:13px}

.tip{position:absolute;z-index:4;pointer-events:none;padding:10px 12px;border-radius:12px;font-size:13px;display:flex;flex-direction:column;gap:6px;white-space:nowrap;transform:translate(16px,-50%);background:var(--panel-solid)}
.tip .h{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tip small{display:block;color:var(--muted);font-size:11px}
.tip .row{display:flex;gap:10px;font:500 11px var(--f-data);color:var(--muted)}
.tip .row b{font-weight:600}
.tip .row b.g{color:var(--good)}.tip .row b.y{color:var(--mid)}.tip .row b.r{color:var(--bad)}

.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:500 13px var(--f-data);z-index:1}

@media (max-width:760px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:44%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.collapsed{max-height:56px}
  body.has-panel .ctrls{right:16px}
  .ctrls{bottom:auto;top:16px}
  .ctrls button{width:38px;height:38px}
  .top{width:calc(100% - 86px)}
  .brand p,.modes small{display:none}
  .modes button{align-items:center;padding:8px 4px}
  .legend{bottom:calc(44% + 10px);padding:8px 10px}
  body.sheet-collapsed .legend{bottom:66px}
  .legend .note,.legend .lbl,.legend .ramp,.legend .zoomhint,.chip b{display:none}
  .chips{flex-wrap:nowrap;gap:4px}
  .chip{padding:5px 8px;font-size:11px;gap:5px;white-space:nowrap}
  .grab{display:block!important}
}
.grab{display:none;width:100%;border:0;background:none;padding:8px 0 0;cursor:pointer}
.grab::before{content:"";display:block;margin:0 auto;width:38px;height:4px;border-radius:2px;background:var(--muted);opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="globe" aria-label="Interactive globe of real-estate opportunity scores"></canvas>
  <div class="loading" id="loading">Loading map…</div>

  <div class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38d08a"/><stop offset=".55" stop-color="#f4c430"/><stop offset="1" stop-color="#f25f57"/></linearGradient></defs><circle cx="16" cy="16" r="14" fill="none" stroke="url(#mk)" stroke-width="2.5"/><path d="M9 21V13l7-5 7 5v8h-4v-5h-6v5z" fill="#eaf0f7"/></svg>
      <div><h1>Build Atlas</h1><p>Where to start a real-estate company</p></div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" class="glass" type="search" placeholder="Search a city, town or country" autocomplete="off" aria-label="Search places" aria-controls="results">
      <ul class="results glass" id="results" role="listbox" hidden></ul>
    </div>
    <div class="modes glass" role="group" aria-label="Rate places by">
      <button id="m-overall" data-m="overall" aria-pressed="true"><b><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Overall</b><small>Best all-round</small></button>
      <button id="m-price" data-m="price" aria-pressed="false"><b><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Price</b><small>Cheapest to build</small></button>
      <button id="m-potential" data-m="potential" aria-pressed="false"><b><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Potential</b><small>Most growth ahead</small></button>
    </div>

  <div class="legend glass">
    <div class="lbl" id="legendTitle">Overall opportunity</div>
    <div class="ramp" aria-hidden="true"></div>

      <button class="chip" id="chip-g" aria-pressed="true"><i style="background:var(--good);color:var(--good)"></i><span id="lab-g"></span> <b id="cnt-g"></b></button>
      <button class="chip" id="chip-y" aria-pressed="true"><i style="background:var(--mid);color:var(--mid)"></i><span id="lab-y"></span> <b id="cnt-y"></b></button>
      <button class="chip" id="chip-r" aria-pressed="true"><i style="background:var(--bad);color:var(--bad)"></i><span id="lab-r"></span> <b id="cnt-r"></b></button>
    </div>
    <div class="zoomhint" id="zoomhint"></div>
    <div class="note" id="legendNote"></div>
  </div>

  <div class="ctrls">
    <button class="glass" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="glass" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="glass" id="home" aria-label="Show whole globe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></button>
  </div>

  <aside class="panel glass" id="panel" aria-live="polite">
    <button class="grab" id="grab" aria-label="Expand or collapse panel"></button>
    <div class="panel-scroll" id="panelBody"></div>
  </aside>

  <div class="tip glass" id="tip" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const DEG = 180/Math.PI;

/* ---------- scoring ---------- */
const FACTORS = [
  ["D","Demand growth","Population growth, urbanisation, new households"],
  ["E","Economy","GDP growth outlook, incomes, inflation"],
  ["A","Affordability & yield","Price-to-income, rental yields, land and build cost"],
  ["S","Stability","Rule of law, property rights, political and currency risk"],
  ["F","Business & finance","Permits, foreign ownership, mortgage market depth"]
];
const POT_W = {D:.45, E:.40, S:.15};
const clamp = v => Math.max(3, Math.min(97, Math.round(v)));
// Price score: cheaper per m2 = higher. $400/m2 -> 100, $25,000/m2 -> 0 (log scale).
const LMAX = Math.log(25000), LMIN = Math.log(400);
const priceScore = p => clamp(100*(LMAX-Math.log(p))/(LMAX-LMIN));
const priceAt = s => Math.exp(LMAX - s/100*(LMAX-LMIN));

for (const k in COUNTRIES){
  const c = COUNTRIES[k];
  c.overall = FACTORS.reduce((s,[f],i)=>s + c.f[i]*WEIGHTS[f], 0);
  c.potential = c.f[0]*POT_W.D + c.f[1]*POT_W.E + c.f[3]*POT_W.S;
  c.price = priceScore(c.p);
}
function sizeMod(pop){
  if (pop>=1e7) return 5; if (pop>=5e6) return 4; if (pop>=1e6) return 3;
  if (pop>=3e5) return 1; if (pop>=1e5) return 0; if (pop>=3e4) return -2; return -4;
}
function sizePrice(pop){
  if (pop>=1e7) return 1.6; if (pop>=5e6) return 1.45; if (pop>=1e6) return 1.25;
  if (pop>=3e5) return 1.05; if (pop>=1e5) return .9; if (pop>=3e4) return .75; return .6;
}
const rate = s => s>=65?"g":s>=50?"y":"r";
const P = PLACES.map((r,i)=>{
  const [name,lon,lat,pop,mz,ck,adm1,cap,hot,cp] = r;
  const c = COUNTRIES[ck];
  const sm = sizeMod(pop), cm = cap?2:0;
  const ppm = cp || Math.round(c.p * sizePrice(pop) * (cap?1.15:1) * (1+Math.abs(hot)*0.03) / 50) * 50;
  const p = {i,name,lon,lat,pop,mz,ck,adm1,cap,hot,sm,cm,ppm,lname:name.toLowerCase(),known:!!cp};
  p.s = {
    overall: clamp(c.overall + sm + cm + hot),
    price: priceScore(ppm),
    potential: clamp(c.potential + sm*0.6 + (cap?1:0) + hot*1.3 + (c.f[2]-50)*0.1)
  };
  return p;
});
const RCOL = {g:"#38d08a", y:"#f4c430", r:"#f25f57"};
const MODES = {
  overall:{title:"Overall opportunity", noun:"Opportunity score",
    labels:{g:"Strong opportunity", y:"Moderate opportunity", r:"High risk"},
    chips:{g:"65–100%", y:"50–64%", r:"0–49%"},
    note:"Mix of demand, economy, affordability, stability and ease of doing business.",
    low:"Riskiest"},
  price:{title:"Price to buy and build", noun:"Price score",
    labels:{g:"Low cost", y:"Mid-priced", r:"Expensive"},
    chips:{g:"<"+usd(priceAt(65))+"/m²", y:usd(priceAt(65))+"–"+usd(priceAt(50)), r:">"+usd(priceAt(50))},
    note:"Green is cheaper land and homes, based on estimated typical apartment prices per m².",
    low:"Priciest"},
  potential:{title:"Growth potential", noun:"Potential score",
    labels:{g:"High potential", y:"Some potential", r:"Low potential"},
    chips:{g:"65–100%", y:"50–64%", r:"0–49%"},
    note:"Where demand and prices should grow most: population, economy, local momentum.",
    low:"Slowest"}
};
function usd(v){ return v>=1000 ? "$"+(v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,"")+"k" : "$"+Math.round(v/10)*10; }
let mode = "overall";
try { const m = localStorage.getItem("buildatlas.mode"); if (MODES[m]) mode = m; } catch(e){}
const S = p => p.s[mode];
const CS = c => Math.round(c[mode]);

const byCountry = {};
P.forEach(p=>{ (byCountry[p.ck] ||= []).push(p); });
function sortCountryLists(){ for (const k in byCountry) byCountry[k].sort((a,b)=>S(b)-S(a) || b.pop-a.pop); }

/* ---------- topojson decode (Polygon / MultiPolygon only) ---------- */
function decode(topo){
  const [sx,sy] = topo.transform.scale, [tx,ty] = topo.transform.translate;
  const arcs = topo.arcs.map(a=>{ let x=0,y=0; return a.map(([dx,dy])=>{ x+=dx; y+=dy; return [x*sx+tx, y*sy+ty]; }); });
  const ring = idx => { const pts=[]; idx.forEach(i=>{ const a = i<0 ? arcs[~i].slice().reverse() : arcs[i]; if (pts.length) pts.pop(); for (const p of a) pts.push(p); }); return pts; };
  return topo.objects.countries.geometries.filter(g=>g.type).map(g=>({
    type:"Feature", k:g.k,
    geometry: g.type==="Polygon" ? {type:"Polygon",coordinates:g.arcs.map(ring)}
                                 : {type:"MultiPolygon",coordinates:g.arcs.map(p=>p.map(ring))}
  }));
}
const F50 = decode(TOPO50), F110 = decode(TOPO110);
for (const f of F50.concat(F110)){
  const polys = f.geometry.type==="Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
  let best=null, ba=-1;
  for (const pc of polys){ const g={type:"Polygon",coordinates:pc}; const a=d3.geoArea(g); if (a>ba && a<6){ba=a;best=g;} }
  f.anchor = best ? d3.geoCentroid(best) : d3.geoCentroid(f);
  f.bigArea = ba;
  const b = d3.geoBounds(f);
  f.center = d3.geoCentroid(f);
  f.rad = Math.max(d3.geoDistance(f.center,b[0]), d3.geoDistance(f.center,b[1]), d3.geoDistance(f.center,[b[0][0],b[1][1]]), d3.geoDistance(f.center,[b[1][0],b[0][1]]));
  if (d3.geoArea(f) > 6) f.rad = Math.PI;
}
const featByKey = {};
F50.forEach(f=>{ featByKey[f.k]=f; });
// continuous fill colour for countries, discrete buckets for dots and pills
const fillScale = d3.scaleLinear().domain([25,50,57,65,85]).range(["#c2413a","#e0703c","#e7b62f","#3fbf7f","#2fd89a"]).clamp(true);

/* ---------- canvas + projection ---------- */
const canvas = $("globe"), ctx = canvas.getContext("2d");
const starsC = $("stars"), sctx = starsC.getContext("2d");
let W=0, H=0, DPR=1, R0=300;
const proj = d3.geoOrthographic().clipAngle(90).precision(0.3);
const path = d3.geoPath(proj, ctx);
const grat = d3.geoGraticule10();
const state = { rot:[20,-22,0], k:1 };
let sel = null;
const show = {g:true,y:true,r:true};
let hits = [];
let dirty = true;
const MINK = 0.7;
let MAXK = 400;
const zoom = d3.zoom().scaleExtent([MINK,MAXK]).clickDistance(4)
  .filter(ev => (!ev.ctrlKey || ev.type==="wheel") && !ev.button && ev.type!=="dblclick");

// fixed pseudo-random starfield
const STARS = (()=>{ let s=7; const rnd=()=>((s=(s*16807)%2147483647)/2147483647); return Array.from({length:420},()=>[rnd(),rnd(),rnd()]); })();
function drawStars(){
  starsC.width = Math.round(W*DPR); starsC.height = Math.round(H*DPR);
  sctx.setTransform(DPR,0,0,DPR,0,0);
  const g = sctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.8);
  g.addColorStop(0,"#0b1630"); g.addColorStop(.55,"#060b18"); g.addColorStop(1,"#03050b");
  sctx.fillStyle = g; sctx.fillRect(0,0,W,H);
  for (const [x,y,b] of STARS){
    sctx.globalAlpha = .15 + b*.6;
    sctx.fillStyle = b>.92 ? "#cfe4ff" : "#ffffff";
    sctx.fillRect(x*W, y*H, b>.85?1.6:1, b>.85?1.6:1);
  }
  sctx.globalAlpha = 1;
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  R0 = Math.min(W, H) * (W<760 ? 0.42 : 0.4);
  MAXK = kForZoom(9.5);
  zoom.scaleExtent([MINK, MAXK]);
  drawStars();
  dirty = true;
}
function cx(){ return W<760 ? W/2 : (document.body.classList.contains("has-panel") ? (W-388)/2 + 16 : W/2); }
function cy(){ return W<760 ? H*0.37 : H/2; }
function R(){ return R0*state.k; }
function webZoom(){ return Math.log2(2*Math.PI*R()/256); }
function kForZoom(z){ return (256*Math.pow(2,z))/(2*Math.PI*R0); }
function apply(){ proj.scale(R()).translate([cx(),cy()]).rotate(state.rot).clipExtent([[-20,-20],[W+20,H+20]]); }
function viewCenter(){ return [-state.rot[0], -state.rot[1]]; }
function visibleAngle(){ return Math.min(Math.PI/2, (Math.hypot(W,H)/2 + 40)/R()) + 0.02; }

const SANS = '"IBM Plex Sans", system-ui, sans-serif', MONO = '"IBM Plex Mono", ui-monospace, monospace';

function draw(){
  apply();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const r = R(), x0=cx(), y0=cy(), whole = r < 3*Math.max(W,H);
  const z = webZoom();
  // outer atmosphere
  if (whole){
    const g = ctx.createRadialGradient(x0,y0,r*.96,x0,y0,r*1.22);
    g.addColorStop(0,"rgba(120,180,255,.38)"); g.addColorStop(.25,"rgba(90,150,255,.14)"); g.addColorStop(1,"rgba(80,140,255,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x0,y0,r*1.22,0,2*Math.PI); ctx.fill();
  }
  // ocean
  ctx.beginPath(); path({type:"Sphere"});
  if (whole){
    const og = ctx.createRadialGradient(x0-r*.38,y0-r*.42,r*.05,x0,y0,r*1.02);
    og.addColorStop(0,"#1b3a5c"); og.addColorStop(.55,"#0f243d"); og.addColorStop(1,"#081526");
    ctx.fillStyle = og;
  } else ctx.fillStyle = "#0f2238";
  ctx.fill();
  ctx.beginPath(); path(grat); ctx.strokeStyle="rgba(170,200,235,.07)"; ctx.lineWidth=.8; ctx.stroke();

  // countries: dark land base, then score colour
  const feats = z < 4.2 ? F110 : F50;
  const vc = viewCenter(), va = visibleAngle();
  const vis = feats.filter(f => d3.geoDistance(vc, f.center) - f.rad < va);
  ctx.beginPath(); for (const f of vis) path(f);
  ctx.fillStyle = "#16212e"; ctx.fill();
  const fa = z < 6 ? .62 : .4;
  for (const f of vis){
    const sc = CS(COUNTRIES[f.k]);
    ctx.beginPath(); path(f);
    ctx.globalAlpha = show[rate(sc)] ? fa : .08;
    ctx.fillStyle = fillScale(sc); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.beginPath(); for (const f of vis) path(f);
  ctx.strokeStyle = "rgba(6,12,22,.75)"; ctx.lineWidth = z<5 ? 1.1 : 1.6; ctx.stroke();
  ctx.strokeStyle = "rgba(235,245,255,.32)"; ctx.lineWidth = z<5 ? .5 : .8; ctx.stroke();
  if (sel && sel.type==="country" && featByKey[sel.k]){
    ctx.beginPath(); path(featByKey[sel.k]);
    ctx.shadowColor="#8ec5ff"; ctx.shadowBlur=12; ctx.strokeStyle="#bfe0ff"; ctx.lineWidth=2; ctx.stroke(); ctx.shadowBlur=0;
  }

  // sphere lighting: soft shade toward the limb plus a specular highlight
  if (whole){
    ctx.save(); ctx.beginPath(); path({type:"Sphere"}); ctx.clip();
    const sh = ctx.createRadialGradient(x0-r*.35,y0-r*.4,r*.2,x0,y0,r);
    sh.addColorStop(0,"rgba(0,0,0,0)"); sh.addColorStop(.7,"rgba(2,6,14,.12)"); sh.addColorStop(1,"rgba(2,6,14,.55)");
    ctx.fillStyle = sh; ctx.fillRect(x0-r,y0-r,2*r,2*r);
    const hl = ctx.createRadialGradient(x0-r*.42,y0-r*.48,0,x0-r*.42,y0-r*.48,r*.7);
    hl.addColorStop(0,"rgba(200,225,255,.13)"); hl.addColorStop(1,"rgba(200,225,255,0)");
    ctx.fillStyle = hl; ctx.fillRect(x0-r,y0-r,2*r,2*r);
    ctx.restore();
    ctx.beginPath(); path({type:"Sphere"}); ctx.strokeStyle="rgba(150,200,255,.35)"; ctx.lineWidth=1.2; ctx.stroke();
  }

  // places in view
  const dotZ = z + 1.3, labZ = z + 0.2;
  const [l0,p0] = vc.map(v=>v/DEG);
  const sinP0=Math.sin(p0), cosP0=Math.cos(p0);
  const visible = [];
  for (const p of P){
    if (p.mz > dotZ && !(sel && sel.p===p)) continue;
    if (!show[rate(S(p))]) continue;
    const lam=p.lon/DEG, phi=p.lat/DEG;
    if (sinP0*Math.sin(phi) + cosP0*Math.cos(phi)*Math.cos(lam-l0) < 0.02) continue;
    const xy = proj([p.lon,p.lat]); if (!xy) continue;
    if (xy[0]<-10||xy[1]<-10||xy[0]>W+10||xy[1]>H+10) continue;
    visible.push([p,xy]);
  }

  // glowing hot spots for the strongest big markets
  if (z < 6.5 && mode!=="price"){
    ctx.globalCompositeOperation = "lighter";
    let n = 0;
    for (const [p,xy] of visible){
      if (S(p) < 70 || p.pop < 4e5) continue;
      if (++n > 90) break;
      const gr = (z<4?14:20) * (p.pop>=5e6?1.5:1);
      const g = ctx.createRadialGradient(xy[0],xy[1],0,xy[0],xy[1],gr);
      g.addColorStop(0,"rgba(80,240,160,.45)"); g.addColorStop(1,"rgba(80,240,160,0)");
      ctx.fillStyle = g; ctx.fillRect(xy[0]-gr,xy[1]-gr,2*gr,2*gr);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // country labels when zoomed out
  const boxes = [];
  if (z < 6.2){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    const list = F50.filter(f=>f.bigArea*r*r > (z<3.6?2600:1400) && d3.geoDistance(vc,f.anchor) < Math.PI/2 - 0.12).sort((a,b)=>b.bigArea-a.bigArea);
    for (const f of list){
      const pt = proj(f.anchor); if (!pt) continue;
      const c = COUNTRIES[f.k], sc = CS(c), rt = rate(sc);
      const label = c.n.toUpperCase();
      ctx.font = `600 ${z<4?10:11}px ${SANS}`;
      const w = ctx.measureText(label).width;
      const b = [pt[0]-w/2-4, pt[1]-14, w+8, 32];
      if (overlaps(boxes,b)) continue; boxes.push(b);
      ctx.lineJoin="round"; ctx.lineWidth=3; ctx.strokeStyle="rgba(4,8,16,.55)";
      ctx.strokeText(label, pt[0], pt[1]-5);
      ctx.fillStyle = "rgba(240,246,252,.82)"; ctx.fillText(label, pt[0], pt[1]-5);
      const txt = mode==="price" ? usd(c.p) : sc+"%";
      ctx.font = `600 10px ${MONO}`;
      const tw = ctx.measureText(txt).width + 10;
      ctx.globalAlpha = show[rt] ? 1 : .3;
      roundRect(pt[0]-tw/2, pt[1]+3, tw, 14, 7); ctx.fillStyle = RCOL[rt]; ctx.fill();
      ctx.fillStyle = "#06101b"; ctx.fillText(txt, pt[0], pt[1]+10.5);
      ctx.globalAlpha = 1;
    }
  }

  // dots
  hits = [];
  for (const [p,xy] of visible){
    const rr = dotR(p, z), col = RCOL[rate(S(p))];
    if (p.pop >= 1e6 || p.cap){
      ctx.beginPath(); ctx.arc(xy[0],xy[1],rr+2.5,0,2*Math.PI);
      ctx.strokeStyle = col; ctx.globalAlpha=.45; ctx.lineWidth=1; ctx.stroke(); ctx.globalAlpha=1;
    }
    ctx.beginPath(); ctx.arc(xy[0],xy[1],rr,0,2*Math.PI);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(4,8,16,.9)"; ctx.stroke();
    hits.push({x:xy[0],y:xy[1],r:Math.max(rr,6),p});
  }

  // place labels (priority order already: min zoom, then population)
  ctx.textBaseline="middle"; ctx.textAlign="left";
  let labelled = 0;
  const pin = sel && sel.type==="place" ? visible.find(v=>v[0]===sel.p) : null;
  const order = pin ? [pin].concat(visible.filter(v=>v!==pin)) : visible;
  for (const [p,xy] of order){
    const isPin = pin && p===pin[0];
    if (p.mz > labZ && !isPin) continue;
    if (labelled > 260) break;
    const big = p.mz <= 3 || p.pop >= 5e6;
    const fs = big ? 13 : p.mz<=5 ? 12 : 11;
    const nameFont = `${big?600:500} ${fs}px ${SANS}`;
    ctx.font = nameFont;
    const tw = ctx.measureText(p.name).width;
    const pill = mode==="price" ? usd(p.ppm) : S(p)+"%";
    ctx.font = `600 10px ${MONO}`;
    const pw = ctx.measureText(pill).width + 9;
    const rr = dotR(p,z);
    const lx = xy[0]+rr+5, ly = xy[1];
    const b = [lx-2, ly-fs/2-3, tw+pw+10, fs+6];
    if (overlaps(boxes,b) && !isPin) continue;
    boxes.push(b); labelled++;
    ctx.font = nameFont;
    ctx.lineJoin="round"; ctx.lineWidth=3.5; ctx.strokeStyle="rgba(4,8,16,.88)";
    ctx.strokeText(p.name, lx, ly);
    ctx.fillStyle = "#f2f6fb"; ctx.fillText(p.name, lx, ly);
    const px = lx+tw+5;
    roundRect(px, ly-7, pw, 14, 7); ctx.fillStyle = RCOL[rate(S(p))]; ctx.fill();
    ctx.font = `600 10px ${MONO}`;
    ctx.fillStyle = "#06101b"; ctx.fillText(pill, px+4.5, ly+0.5);
  }
  if (pin){
    const [,xy] = pin;
    ctx.beginPath(); ctx.arc(xy[0],xy[1],dotR(pin[0],z)+6,0,2*Math.PI);
    ctx.shadowColor="#8ec5ff"; ctx.shadowBlur=10; ctx.strokeStyle="#bfe0ff"; ctx.lineWidth=2; ctx.stroke(); ctx.shadowBlur=0;
  }
  $("zoomhint").textContent = z < 5 ? "Zoom in to see more cities and towns" : z < 7.5 ? "Zoom further for small towns" : "Showing towns";
}
function dotR(p,z){
  const base = p.pop>=5e6?5:p.pop>=1e6?4:p.pop>=2e5?3.2:2.6;
  return base + Math.max(0,Math.min(2,(z-5)*0.4));
}
function overlaps(boxes,b){
  for (const o of boxes) if (b[0]<o[0]+o[2] && b[0]+b[2]>o[0] && b[1]<o[1]+o[3] && b[1]+b[3]>o[1]) return true;
  return false;
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function loop(){ if (dirty){ dirty=false; draw(); } requestAnimationFrame(loop); }

/* ---------- interaction ---------- */
let last = {x:0,y:0};
const csel = d3.select(canvas);
zoom.on("start", ev=>{ last={x:ev.transform.x,y:ev.transform.y}; if (ev.sourceEvent && ev.sourceEvent.type!=="wheel") canvas.classList.add("dragging"); hideTip(); })
    .on("zoom", ev=>{
      const t = ev.transform, se = ev.sourceEvent;
      if (se && se.type==="wheel"){
        zoomAbout(t.k, d3.pointer(se, canvas));
      } else if (se){
        const dpp = DEG / R();
        state.k = t.k;
        state.rot[0] += (t.x-last.x)*dpp;
        state.rot[1] = Math.max(-89, Math.min(89, state.rot[1] - (t.y-last.y)*dpp));
      } else {
        state.k = t.k;
      }
      last={x:t.x,y:t.y}; dirty=true;
    })
    .on("end", ()=>canvas.classList.remove("dragging"));
csel.call(zoom).on("dblclick.zoom", null);

function zoomAbout(k, pt){
  apply();
  const geo = proj.invert(pt);
  state.k = k; apply();
  if (!geo || d3.geoDistance(geo, viewCenter()) > Math.PI/2) return;
  for (let i=0;i<2;i++){
    const np = proj(geo); if (!np) break;
    const dpp = DEG / R();
    state.rot[0] -= (np[0]-pt[0])*dpp;
    state.rot[1] = Math.max(-89, Math.min(89, state.rot[1] + (np[1]-pt[1])*dpp));
    apply();
  }
}
function setK(k){ zoom.transform(csel, d3.zoomIdentity.translate(last.x,last.y).scale(k)); }

let anim = null;
function flyTo(lon, lat, k){
  if (anim) anim.stop();
  const r0 = state.rot.slice(), k0 = state.k;
  const r1 = [-lon, -lat, 0];
  while (r1[0]-r0[0] > 180) r1[0]-=360;
  while (r1[0]-r0[0] < -180) r1[0]+=360;
  const ir = d3.interpolate(r0, r1);
  const lk0 = Math.log(k0), lk1 = Math.log(k);
  const dist = d3.geoDistance(viewCenter(), [lon,lat]);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = reduce ? 0 : 900 + 500*dist;
  anim = d3.timer(el=>{
    const t = dur ? Math.min(1, el/dur) : 1, e = d3.easeCubicInOut(t);
    state.rot = ir(e);
    const base = lk0 + (lk1-lk0)*e;
    const dip = dist>0.3 ? Math.sin(Math.PI*e) * Math.max(0, Math.min(base, dist*1.5)) : 0;
    setK(Math.exp(base - dip));
    dirty = true;
    if (t>=1){ anim.stop(); anim=null; }
  });
}

function nearest(pt){
  let best=null, bd=Infinity;
  for (let i=hits.length-1;i>=0;i--){
    const h=hits[i], d=Math.hypot(h.x-pt[0],h.y-pt[1]);
    if (d<=h.r+3 && d<bd){ bd=d; best=h; }
  }
  return best;
}
const tip = $("tip");
function hideTip(){ tip.hidden = true; canvas.classList.remove("pointing"); }
canvas.addEventListener("mousemove", ev=>{
  if (canvas.classList.contains("dragging")) return;
  const pt = d3.pointer(ev, canvas), h = nearest(pt);
  if (!h){ hideTip(); return; }
  canvas.classList.add("pointing");
  const p = h.p, c = COUNTRIES[p.ck];
  tip.innerHTML = `<div class="h"><div><b>${esc(p.name)}</b><small>${esc(p.adm1 ? p.adm1+", " : "")}${esc(c.n)}</small></div><span class="pct ${rate(S(p))}">${S(p)}%</span></div>
    <div class="row"><span>Overall <b class="${rate(p.s.overall)}">${p.s.overall}%</b></span><span>Price <b class="${rate(p.s.price)}">${usd(p.ppm)}/m²</b></span><span>Potential <b class="${rate(p.s.potential)}">${p.s.potential}%</b></span></div>`;
  tip.style.left = h.x+"px"; tip.style.top = h.y+"px"; tip.hidden = false;
});
canvas.addEventListener("mouseleave", hideTip);
canvas.addEventListener("click", ev=>{
  const pt = d3.pointer(ev, canvas), h = nearest(pt);
  if (h){ selectPlace(h.p, false); return; }
  apply();
  const geo = proj.invert(pt);
  if (!geo || d3.geoDistance(geo, viewCenter()) > Math.PI/2) return;
  const feats = webZoom() < 4.2 ? F110 : F50;
  const f = feats.find(f=>d3.geoDistance(geo,f.center) <= f.rad+0.01 && d3.geoContains(f, geo));
  if (f) selectCountry(f.k, false);
});
canvas.addEventListener("dblclick", ev=>{
  apply();
  const geo = proj.invert(d3.pointer(ev, canvas));
  if (geo) flyTo(geo[0], geo[1], Math.min(MAXK, state.k*3));
});
$("zin").onclick = ()=>flyTo(...viewCenter(), Math.min(MAXK, state.k*2.2));
$("zout").onclick = ()=>flyTo(...viewCenter(), Math.max(MINK, state.k/2.2));
$("home").onclick = ()=>flyTo(...viewCenter(), 1);
window.addEventListener("resize", resize);

/* ---------- modes + filters ---------- */
function setMode(m){
  mode = m;
  try { localStorage.setItem("buildatlas.mode", m); } catch(e){}
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===m));
  const M = MODES[m], counts = {g:0,y:0,r:0};
  P.forEach(p=>counts[rate(S(p))]++);
  $("legendTitle").textContent = M.title;
  $("legendNote").textContent = M.note + " Indicative estimates, not financial advice.";
  for (const r of ["g","y","r"]){ $("lab-"+r).textContent = M.chips[r]; $("cnt-"+r).textContent = counts[r].toLocaleString(); }
  sortCountryLists(); buildRankings();
  renderPanel(); dirty = true;
}
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
for (const r of ["g","y","r"]){
  $("chip-"+r).onclick = e=>{ show[r] = !show[r]; e.currentTarget.setAttribute("aria-pressed", show[r]); dirty=true; };
}

/* ---------- panel ---------- */
const panel = $("panel"), body = $("panelBody");
let tab = "cities";
let topCities=[], topCountries=[], lowCities=[];
const STABLE = 35; // stability floor for the cheapest-places lists (skips war zones)
function buildRankings(){
  const ok = c => mode!=="price" || c.f[3] >= STABLE;
  const tie = (a,b) => mode==="price" ? a.ppm-b.ppm : b.pop-a.pop;
  topCities = P.filter(p=>p.pop>=3e5 && ok(COUNTRIES[p.ck])).sort((a,b)=>S(b)-S(a)||tie(a,b)).slice(0,25);
  topCountries = Object.entries(COUNTRIES).filter(([k,c])=>featByKey[k] && byCountry[k] && ok(c)).sort((a,b)=>b[1][mode]-a[1][mode]||a[1].p-b[1].p).slice(0,25);
  lowCities = P.filter(p=>p.pop>=1e6).sort((a,b)=>S(a)-S(b)||-tie(a,b)).slice(0,15);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtPop(n){ return n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+"M" : n>=1e3 ? Math.round(n/1e3)+"k" : String(n||"—"); }
function sign(n){ n = Math.round(n*10)/10; return (n>0?"+":n<0?"−":"±")+Math.abs(n); }
function bars(c){
  return `<div class="bars">${FACTORS.map(([f,t,d],i)=>{
    const v=c.f[i];
    return `<div class="bar" title="${esc(d)}"><span class="t">${t}</span><span class="v">${v}</span><div class="track"><div class="fill" style="width:${v}%;background:${RCOL[rate(v)]}"></div></div></div>`;
  }).join("")}</div>`;
}
function ring(score){
  const rt = rate(score), C = 2*Math.PI*42;
  return `<div class="ringwrap"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="rgba(160,190,225,.12)" stroke-width="8"/><circle cx="48" cy="48" r="42" fill="none" stroke="${RCOL[rt]}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*score/100} ${C}"/></svg><div class="num"><span>${score}<small>%</small></span></div></div>`;
}
function tiles(sc){
  return `<div class="tiles">${[["overall","Overall"],["price","Price"],["potential","Potential"]].map(([m,l])=>
    `<button class="tile" data-mode="${m}" aria-pressed="${m===mode}"><span>${l}</span><b class="${rate(sc[m])}">${sc[m]}%</b></button>`).join("")}</div>`;
}
function rowItem(p, rank, sub){
  const extra = mode==="price" ? `<em>${usd(p.ppm)}/m²</em>` : "";
  return `<li data-i="${p.i}"><span class="rk">${rank}</span><div class="nm"><div>${esc(p.name)}</div><small>${esc(sub)}</small></div><div class="side"><span class="pct ${rate(S(p))}">${S(p)}%</span>${extra}</div></li>`;
}
function bindList(){
  body.querySelectorAll("li[data-i]").forEach(li=>li.onclick=()=>selectPlace(P[+li.dataset.i], true));
  body.querySelectorAll("li[data-k]").forEach(li=>li.onclick=()=>selectCountry(li.dataset.k, true));
  const b = body.querySelector(".back"); if (b) b.onclick = ()=>{ sel=null; dirty=true; renderPanel(); };
  body.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.t; renderPanel(); });
  body.querySelectorAll(".tile").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
}
function breakdown(p, c){
  if (mode==="overall") return `
    <dt>${esc(c.n)} baseline</dt><dd>${c.overall.toFixed(1)}</dd>
    <dt>Market size (${fmtPop(p.pop)})</dt><dd>${sign(p.sm)}</dd>
    ${p.cm ? `<dt>National capital</dt><dd>${sign(p.cm)}</dd>` : ""}
    ${p.hot ? `<dt>Local momentum</dt><dd>${sign(p.hot)}</dd>` : ""}`;
  if (mode==="potential") return `
    <dt>${esc(c.n)} growth baseline</dt><dd>${c.potential.toFixed(1)}</dd>
    <dt>Market size (${fmtPop(p.pop)})</dt><dd>${sign(p.sm*0.6)}</dd>
    ${p.cap ? `<dt>National capital</dt><dd>+1</dd>` : ""}
    ${p.hot ? `<dt>Local momentum</dt><dd>${sign(p.hot*1.3)}</dd>` : ""}
    <dt>Price headroom</dt><dd>${sign((c.f[2]-50)*0.1)}</dd>`;
  return `
    <dt>${esc(c.n)} typical price</dt><dd>${usd(c.p)}/m²</dd>
    <dt>${p.known ? "Known city price" : "Size, capital and demand"}</dt><dd>${p.known ? usd(p.ppm) : "×"+(p.ppm/c.p).toFixed(2)}</dd>
    <dt>Estimated price here</dt><dd>${usd(p.ppm)}/m²</dd>`;
}
function renderPanel(){
  const M = MODES[mode];
  if (!sel){
    const sub = p => `${COUNTRIES[p.ck].n} · ${fmtPop(p.pop)} people`;
    let list;
    if (tab==="cities") list = topCities.map((p,i)=>rowItem(p,i+1,sub(p))).join("");
    else if (tab==="countries") list = topCountries.map(([k,c],i)=>{ const s=CS(c); return `<li data-k="${k}"><span class="rk">${i+1}</span><div class="nm"><div>${esc(c.n)}</div><small>${byCountry[k].length} places scored</small></div><div class="side"><span class="pct ${rate(s)}">${s}%</span>${mode==="price"?`<em>${usd(c.p)}/m²</em>`:""}</div></li>`; }).join("");
    else list = lowCities.map((p,i)=>rowItem(p,i+1,sub(p))).join("");
    const heading = {overall:"Best places to build", price:"Cheapest places to build", potential:"Most growth potential"}[mode];
    body.innerHTML = `
      <div><div class="eyebrow">${M.title}</div><h2>${heading}</h2></div>
      <p class="p">${M.note}${mode==="price"&&tab!=="low"?" Lists leave out war zones and very unstable countries.":""} Drag to spin, scroll or pinch to zoom, and tap any place or country for details.</p>
      <div class="tabs" role="tablist">
        <button role="tab" data-t="cities" aria-selected="${tab==="cities"}">Top cities</button>
        <button role="tab" data-t="countries" aria-selected="${tab==="countries"}">Top countries</button>
        <button role="tab" data-t="low" aria-selected="${tab==="low"}">${M.low}</button>
      </div>
      <ul class="list">${list}</ul>`;
  } else if (sel.type==="place"){
    const p = sel.p, c = COUNTRIES[p.ck], list = byCountry[p.ck], sc = S(p), rt = rate(sc);
    const rank = list.indexOf(p)+1;
    body.innerHTML = `
      <button class="back">← All rankings</button>
      <div><div class="eyebrow">${esc(p.adm1 ? p.adm1+" · " : "")}${esc(c.n)}</div><h2>${esc(p.name)}</h2></div>
      <div class="hero">${ring(sc)}
        <div><span class="verdict ${rt}"><i></i>${M.labels[rt]}</span>
        <div class="meta">${M.noun} · #${rank} of ${list.length} in ${esc(c.n)} · ${fmtPop(p.pop)} people</div></div></div>
      ${tiles(p.s)}
      <div class="price"><span>Est. property price</span><b>${usd(p.ppm)}/m²</b></div>
      <div><h3>How the ${M.noun.toLowerCase()} is built</h3></div>
      <dl class="adj">${breakdown(p,c)}
        <dt class="tot">${M.noun}</dt><dd class="tot">${sc}%</dd></dl>
      <div><h3>National fundamentals</h3></div>
      ${bars(c)}
      <div><h3>Also in ${esc(c.n)}</h3></div>
      <ul class="list">${list.filter(q=>q!==p).slice(0,6).map(q=>rowItem(q,list.indexOf(q)+1,`${q.adm1||c.n} · ${fmtPop(q.pop)}`)).join("")}</ul>`;
  } else {
    const k = sel.k, c = COUNTRIES[k], list = byCountry[k] || [], s = CS(c), rt = rate(s);
    const allRank = Object.values(COUNTRIES).filter(x=>x[mode]>c[mode]).length+1;
    const sc = {overall:Math.round(c.overall), price:c.price, potential:Math.round(c.potential)};
    body.innerHTML = `
      <button class="back">← All rankings</button>
      <div><div class="eyebrow">Country</div><h2>${esc(c.n)}</h2></div>
      <div class="hero">${ring(s)}
        <div><span class="verdict ${rt}"><i></i>${M.labels[rt]}</span>
        <div class="meta">${M.noun} · #${allRank} of ${Object.keys(COUNTRIES).length} countries and territories</div></div></div>
      ${tiles(sc)}
      <div class="price"><span>Typical price per m²</span><b>${usd(c.p)}</b></div>
      ${bars(c)}
      <div><h3>Best places here</h3></div>
      ${list.length ? `<ul class="list">${list.slice(0,10).map((q,i)=>rowItem(q,i+1,`${q.adm1||c.n} · ${fmtPop(q.pop)}`)).join("")}</ul>` : `<p class="p">No cities in the dataset for this territory.</p>`}`;
  }
  bindList();
}
function selectPlace(p, fly){
  sel = {type:"place", p};
  renderPanel(); body.scrollTop = 0; expandSheet(); dirty = true;
  if (fly) flyTo(p.lon, p.lat, Math.max(state.k, kForZoom(Math.max(p.mz+0.5, 6.2))));
}
function selectCountry(k, fly){
  sel = {type:"country", k};
  renderPanel(); body.scrollTop = 0; expandSheet(); dirty = true;
  const f = featByKey[k];
  if (fly && f){
    const rad = Math.max(0.03, Math.min(1.2, f.rad));
    const kk = Math.max(1, Math.min(60, (Math.min(W,H)*0.42) / (R0*Math.sin(Math.min(rad*0.85, Math.PI/2)))));
    flyTo(f.anchor[0], f.anchor[1], kk);
  }
}
$("grab").onclick = ()=>{ const c = panel.classList.toggle("collapsed"); document.body.classList.toggle("sheet-collapsed", c); };
function expandSheet(){ panel.classList.remove("collapsed"); document.body.classList.remove("sheet-collapsed"); }

/* ---------- search ---------- */
const q = $("q"), res = $("results");
let matches = [], cursor = 0;
const countryList = Object.entries(COUNTRIES).filter(([k])=>byCountry[k]||featByKey[k]).map(([k,c])=>({k,c,l:c.n.toLowerCase()}));
function search(){
  const s = q.value.trim().toLowerCase();
  if (!s){ res.hidden = true; matches=[]; return; }
  const cs = countryList.filter(x=>x.l.startsWith(s)).slice(0,3).map(x=>({type:"country",k:x.k}));
  const pre = [], inn = [];
  for (const p of P){ if (p.lname.startsWith(s)) pre.push(p); else if (s.length>2 && p.lname.includes(s)) inn.push(p); }
  pre.sort((a,b)=>b.pop-a.pop); inn.sort((a,b)=>b.pop-a.pop);
  matches = cs.concat(pre.concat(inn).slice(0, 10-cs.length).map(p=>({type:"place",p})));
  cursor = 0;
  res.innerHTML = matches.length ? matches.map((m,i)=>{
    if (m.type==="country"){ const c=COUNTRIES[m.k], s2=CS(c); return `<li role="option" data-n="${i}" aria-selected="${i===cursor}"><div class="nm">${esc(c.n)} <span class="sub">· country</span></div><span class="pct ${rate(s2)}">${s2}%</span></li>`; }
    const p=m.p; return `<li role="option" data-n="${i}" aria-selected="${i===cursor}"><div class="nm">${esc(p.name)} <span class="sub">· ${esc(p.adm1?p.adm1+", ":"")}${esc(COUNTRIES[p.ck].n)}</span></div><span class="pct ${rate(S(p))}">${S(p)}%</span></li>`;
  }).join("") : `<li><div class="nm sub">No place called “${esc(q.value)}” in the dataset</div></li>`;
  res.hidden = false;
  res.querySelectorAll("li[data-n]").forEach(li=>li.onmousedown=e=>{ e.preventDefault(); pick(+li.dataset.n); });
}
function pick(n){
  const m = matches[n]; if (!m) return;
  res.hidden = true; q.blur();
  if (m.type==="country"){ q.value = COUNTRIES[m.k].n; selectCountry(m.k, true); }
  else { q.value = m.p.name; selectPlace(m.p, true); }
}
q.addEventListener("input", search);
q.addEventListener("focus", ()=>{ if (q.value) search(); });
q.addEventListener("blur", ()=>{ res.hidden = true; });
q.addEventListener("keydown", e=>{
  if (e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault(); if (!matches.length) return;
    cursor = (cursor + (e.key==="ArrowDown"?1:-1) + matches.length) % matches.length;
    res.querySelectorAll("li[data-n]").forEach((li,i)=>li.setAttribute("aria-selected", i===cursor));
  } else if (e.key==="Enter"){ e.preventDefault(); pick(cursor); }
  else if (e.key==="Escape"){ res.hidden = true; q.blur(); }
});

/* ---------- boot ---------- */
document.body.classList.add("has-panel");
resize(); setMode(mode);
$("loading").remove();
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ dirty = true; });
let spin = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const stopSpin = ()=>{ spin = false; };
["pointerdown","wheel","keydown","touchstart"].forEach(t=>window.addEventListener(t, stopSpin, {once:true, passive:true}));
d3.timer(()=>{ if (spin && !anim){ state.rot[0] += 0.06; dirty = true; } });
})();
</script>
